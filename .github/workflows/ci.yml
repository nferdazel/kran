name: CI

# Gerbang verifikasi saja (spec §21.1): tidak membangun image, tidak memanggil webhook,
# tidak melakukan deploy. Deploy terjadi di server lewat webhook -> deploy-vps.sh.
#
# Job ditambahkan bertahap bersama komponennya (lihat docs/OPERATIONS.md): job kosong yang
# selalu hijau tidak menegakkan apa pun.

# Tanpa filter `paths:` / `paths-ignore:` dengan sengaja (DEPLOY-FLOW.md §13.7 aturan 10): workflow
# yang difilter tidak menghasilkan check-run sama sekali, sedangkan gate deploy di server menunggu
# keempat check-run job ini dan baru menyerah setelah 30 menit. Konsekuensi yang diterima: push yang
# hanya menyentuh dokumentasi tetap membangun ulang produksi.
on:
  push:
    branches: [main]
  pull_request:
  # Jalan manual di `main`. Dipakai saat event `push` tidak menghasilkan run sama sekali
  # (terjadi 2 Nov 2026 setelah riwayat ditulis ulang: push dan tag sama-sama tidak memicu
  # workflow, sehingga gerbang CI di `deploy-vps.sh` menunggu 30 menit lalu gagal).
  #
  # `update_snapshots=true` menjalankan job `visual-update`: baseline visual Linux di-generate
  # ulang di runner dan diunggah sebagai artifact. Job itu TIDAK meng-commit apa pun, jadi
  # baseline tetap masuk repo lewat review manusia (visual.spec.ts, O-022/D-176).
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Generate Linux visual baselines (--update-snapshots) and upload them as an artifact"
        type: boolean
        default: false

permissions:
  contents: read
  # gitleaks-action lists the pull request's commits on a `pull_request` run;
  # with contents:read alone that call is 403 and the job dies before scanning.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: a cancel between "push image" and "deploy" leaves the
  # host pulling an image whose build was killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Golden CI/CD contract: the same rules the server repo checks, run here so
  # drift fails this repo's own build instead of waiting for a manual audit.
  # The script is a byte-identical copy of the server repo's
  # ops/scripts/contract-check.sh; fix it there and copy it out again.
  contract:
    name: "Contract: golden CI/CD rules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Contract: check this repo"
        run: ./ops/scripts/contract-check.sh .

  nim-check:
    name: Nim (check + unit/property test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          # Dipin supaya hasil bisa diulang dan berbeda dari toolchain lokal tidak lolos diam-diam.
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        # `std/re` (validasi pola COA) membuka `libpcre.so.3` saat jalan lewat dynlib. Runner tidak
        # membawanya; image runtime produksi sudah memasangnya (`apps/api/Dockerfile`). Tanpa ini
        # test lulus di macOS tapi gagal di CI dengan `could not load: libpcre.so`.
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: Pastikan shellcheck ada
        # `./task check` memblokir pada level `warning` dan fail-closed bila tool ini tidak ada
        # (T-050(b), O-014). Runner GitHub umumnya sudah membawanya; langkah ini penjamin.
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version

      - name: ./task check
        # format + nim check + archcheck + lint-nomagic + paramgen --check + i18n check
        run: ./task check

      - name: ./task test
        # unit + property saja. Test integrasi dijalankan job db-tests yang menyediakan DB; job ini
        # menyatakan pelewatan itu secara eksplisit (D-179), bukan mengandalkan skip senyap.
        env:
          KRAN_ALLOW_NO_DB: "1"
        run: ./task test

  traceability:
    name: Traceability (requirement -> kontrol + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install dependencies
        run: nimble install -d -y

      - name: ./task traceability
        # Fail-closed: requirement `active` tanpa kontrol/test, atau rujukan ke parameter/test yang
        # tidak ada, menggagalkan job (spec §4.4). Sumber: docs/compliance/register.yaml.
        run: ./task traceability

  db-tests:
    name: DB (integrasi, Postgres 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kran
          POSTGRES_PASSWORD: kran
          POSTGRES_DB: kran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kran -d kran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Nama basis data HARUS berakhiran `_test`/`_dev`: `dbtools seed --dev` fail-closed (O-062)
      # karena seed dev memuat user contoh dengan kata sandi contoh. Bentuk polos tanpa query
      # string: `parseDatabaseUrl` menolak `?sslmode=...`.
      KRAN_DATABASE_URL: postgres://kran:kran@127.0.0.1:5432/kran_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        # `std/re` (validasi pola COA) membuka `libpcre.so.3` saat jalan lewat dynlib. Runner tidak
        # membawanya; image runtime produksi sudah memasangnya (`apps/api/Dockerfile`). Tanpa ini
        # test lulus di macOS tapi gagal di CI dengan `could not load: libpcre.so`.
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: Migrasi + seed
        # Skema dari migrasi; seed pack (parameter) + seed dev (user contoh `dev.maker`/
        # `dev.checker` yang dipakai test integrasi). `itplatform` menghapus schema `platform`
        # di DB yang ditunjuk, jadi tiap run menyiapkan ulang dari nol — bukan mengandalkan
        # keadaan DB yang tersisa.
        run: |
          ./task dbtools migrate
          ./task dbtools seed --dev

      - name: ./task test (integrasi)
        # Hanya integrasi: unit + property sudah dijalankan job `nim-check`. Mengulanginya di sini
        # membuat job ini menembus `timeout-minutes: 15` (2 Nov 2026: 13m18s total, 3m09s unit).
        env:
          KRAN_TEST_SCOPE: integration
        run: ./task test

  ci-fast:
    name: Gate (./task ci-fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Gerbang yang disebut P0a harus benar-benar dieksekusi di CI, bukan hanya ada di `./task`
    # (T-176). Job ini menjalankan satu perintah yang sama dengan yang dipakai mesin developer.
    #
    # `KRAN_TEST_SCOPE: unit` — bukan pelonggaran, tapi pembagian kerja yang sudah dipakai repo
    # ini: `nim-check` memegang check + unit/property, `db-tests` memegang integrasi. Cakupan
    # penuh di satu job tidak muat di `timeout-minutes: 15`: pada run 43791876685 job `nim-check`
    # 5m55s dan `db-tests` 10m40s, jadi satu job yang menjalankan keduanya menembus 15 menit
    # (alasan yang sama dicatat di `cmd_test` dan di job `db-tests`). Yang dibuktikan job ini
    # adalah rangkaian gate-nya sendiri: check -> openapi -> lint-web -> test -> packages/ui.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kran
          POSTGRES_PASSWORD: kran
          POSTGRES_DB: kran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kran -d kran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KRAN_DATABASE_URL: postgres://kran:kran@127.0.0.1:5432/kran_test
      KRAN_TEST_SCOPE: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        # `ci-fast` menjalankan `cmd_lint_web` (fail-closed sejak T-176) dan test `packages/ui`,
        # jadi dependency JS wajib ada; tanpa langkah ini job gagal di arm web, bukan hijau palsu.
        run: pnpm install --frozen-lockfile

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: Migrasi + seed
        # `ci-fast` memanggil `require_db`, dan skema bersih membuktikan migrasi tetap jalan.
        # Urutan sama dengan job `db-tests`.
        run: |
          ./task dbtools migrate
          ./task dbtools seed --dev

      - name: ./task ci-fast
        run: ./task ci-fast

  web-e2e:
    name: Web (svelte-check + axe + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Database nyata untuk e2e: tanpa ini sebagian besar spec melewati dirinya sendiri dan job
    # tetap hijau (audit 24 Okt 2026, BLK-1/T-126). `./task e2e` memigrasi + seed dev sendiri, dan
    # sejak D-179 ia menolak jalan tanpa DB alih-alih melaporkan hijau dengan test lebih sedikit.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kran
          POSTGRES_PASSWORD: kran
          POSTGRES_DB: kran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kran -d kran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KRAN_DATABASE_URL: postgres://kran:kran@127.0.0.1:5432/kran_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Tanpa `version:`: action membaca `packageManager` di package.json (OPS-3/T-131), jadi CI,
        # build image di VPS, dan mesin lokal memakai pnpm yang sama — termasuk kebijakan
        # `minimumReleaseAge`/`allowBuilds` yang hanya dipatuhi versi baru.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache browser Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser Playwright
        # `playwright` adalah devDependency `apps/web`, bukan root: `pnpm exec` di root tidak
        # menemukannya (ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL: Command "playwright" not found), jadi
        # eksplisit lewat filter paketnya.
        #
        # Tanpa `--with-deps`: langkah itu menjalankan `apt-get update/install` di setiap run dan
        # pernah menghabiskan 14m47s sampai job 15 menit dibatalkan (run 39962254127), padahal
        # browser-nya sudah ada di cache. Lib sistem Chromium sudah tersedia di image runner
        # `ubuntu-24.04`; runner dipin (bukan `ubuntu-latest`) supaya migrasi label tidak
        # diam-diam mengganti set lib itu.
        run: pnpm --filter @kran/web exec playwright install chromium

      - name: ./task lint-web
        # eslint: typescript-eslint + aturan svelte/* non-a11y (D-139). Job ini sudah
        # `pnpm install`; job `nim-check` sengaja tidak, jadi lint web tidak masuk `./task check`.
        run: ./task lint-web

      - name: Setup Nim
        # e2e menjalankan binary hasil `./task build`; job ini sekarang butuh toolchain Nim.
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: ./task openapi
        # lint kontrak OpenAPI + klien TS sinkron + typecheck paket klien
        run: ./task openapi

      - name: ./task e2e
        # kontras token + svelte-check + Playwright (axe 2 tema x 2 locale, alur keyboard-only)
        run: ./task e2e

      - name: "Klasifikasi kegagalan e2e (crash API vs assertion)"
        # T-044: API e2e pernah mati oleh SIGSEGV di allocator Mummy+ORC (3 Nov 2026, commit
        # 2bec65e) dan 60+ test sesudahnya gagal dengan ECONNREFUSED — terbaca seperti 60 regresi
        # fitur. Langkah ini hanya MELAPORKAN; hasil job sudah ditentukan `./task e2e` dan tidak
        # diubah di sini (tidak ada test/timeout yang dilonggarkan).
        # Log ditulis `./task` ke `.build/e2e.log` (`cmd_e2e`), bukan dari ekspresi GitHub.
        if: failure()
        env:
          E2E_LOG: .build/e2e.log
        run: |
          if [ ! -f "$E2E_LOG" ]; then
            echo "::notice::log e2e $E2E_LOG tidak ada (gagal sebelum Playwright) - tidak ada yang diklasifikasikan"
            exit 0
          fi
          if grep -q "Illegal storage access" "$E2E_LOG"; then
            echo "::error::API e2e mati oleh SIGSEGV di allocator (kelas T-044, lihat docs/ACCEPTED-LIMITS.md). Kegagalan test sesudahnya adalah efek berantai ECONNREFUSED 127.0.0.1:8099, bukan regresi fitur. Traceback:"
            grep -n -B2 -A25 "Illegal storage access" "$E2E_LOG" | head -80
          else
            echo "::notice::tidak ada SIGSEGV API di log e2e - kegagalan tampak seperti regresi biasa (periksa assertion pertama)"
          fi

      - name: "Upload artefak Playwright (test-results, report, log)"
        # Tanpa langkah ini kegagalan visual/e2e tidak meninggalkan bukti apa pun di run: diff
        # `toHaveScreenshot` hanya ditulis ke `test-results/`, dan `./task e2e` menyalurkan
        # keluaran Playwright ke `.build/e2e.log` alih-alih stdout. Diambil hanya saat gagal
        # supaya run hijau tidak menumpuk artifact. `if-no-files-found: ignore` karena
        # `playwright-report/` memang tidak ada selama reporter masih `list`.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            .build/e2e.log
          if-no-files-found: ignore
          retention-days: 7

  visual-update:
    name: Visual baselines (update-snapshots, Linux)
    # Hanya saat diminta. Job terpisah, bukan langkah tambahan di `web-e2e`: regenerasi baseline
    # butuh build + reset DB + seed penuh, dan menumpangkannya ke job gerbang membuat job 15 menit
    # itu melewati batasnya. Job ini tidak menggantikan gerbang; `web-e2e` tetap satu-satunya
    # penentu lulus/gagal PR.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kran
          POSTGRES_PASSWORD: kran
          POSTGRES_DB: kran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kran -d kran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KRAN_DATABASE_URL: postgres://kran:kran@127.0.0.1:5432/kran_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache browser Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser Playwright
        run: pnpm --filter @kran/web exec playwright install chromium

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: ./task build
        # Biner API yang dijalankan `webServer` Playwright, sama seperti jalur `./task e2e`.
        run: ./task build

      - name: i18n compile (Paraglide)
        # `apps/web/src/lib/paraglide/` gitignored; `vite build` di webServer Playwright gagal
        # tanpanya.
        run: pnpm --filter @kran/web run i18n:compile

      - name: Siapkan DB dev (reset + migrasi + contract + seed)
        # Lewat `./task dbtools`: `./task build` hanya mengompilasi kran-api, tidak pernah membuat
        # `.build/bin/dbtools` (dibangun `build_tool` di dalam `./task dbtools`). Run 42851540106
        # mati di sini dengan exit 127 karena memanggil biner yang belum ada.
        # Urutan dan alasan sama dengan `cmd_e2e`: reset supaya deterministik, migrasi expand, lalu
        # contract supaya skema final (sesuai sesudah deploy), lalu seed dev.
        run: |
          ./task dbtools reset
          ./task dbtools migrate
          .build/bin/kran-api --role=migrate --contract --root="$PWD"
          ./task dbtools seed --dev

      - name: "Playwright --update-snapshots (visual Linux)"
        # Hanya spec visual: empat baseline (login dan ganti kata sandi, light dan dark). Suite
        # penuh tidak perlu diregenerasi dan tidak dijalankan di sini.
        #
        # `=all`, bukan flag telanjang: flag telanjang berarti mode `changed`, jadi Playwright
        # tidak menulis ulang snapshot selama selisihnya masih di bawah `maxDiffPixelRatio` 0.01.
        # Regenerasi yang diminta harus selalu menulis, kalau tidak artefak yang diunggah cuma
        # salinan baseline lama (terjadi di run 42921526674).
        run: pnpm --filter @kran/web exec playwright test tests/e2e/visual.spec.ts --update-snapshots=all

      - name: Upload baseline hasil regenerasi
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-${{ github.run_id }}
          path: apps/web/tests/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Tanpa `version:`: action membaca `packageManager` di package.json (OPS-3/T-131), sama
        # seperti job web — CI dan mesin lokal memakai pnpm yang identik.

      # No pnpm cache here: the job audits the lockfile without installing, so
      # the store directory never exists and setup-node's post step failed the
      # job trying to save it.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: "Supply chain: dependency CVE gate"
        # Satu jalur dengan mesin developer: `./task deps-check` (T-177, D-205) menjalankan
        # `pnpm audit --audit-level=high --prod` terhadap database advisory npm registry, lalu
        # memastikan setiap `requires` langsung di `kran.nimble` masih memakai versi eksak.
        # Tanpa pnpm atau dengan pin yang dilonggarkan, arm itu gagal tertutup (aturan T-176),
        # jadi kegagalan job di sini berarti temuan atau lingkungan yang rusak, bukan hijau senyap.
        #
        # Tidak ada cache di job ini: perintahnya tidak pernah `pnpm install`, jadi store pnpm
        # tidak pernah terbentuk dan langkah post setup-node dulu gagal menyimpannya.
        run: ./task deps-check

  # Build selalu, push hanya saat event `push` (main). Dockerfile yang berhenti mem-build adalah
  # PR merah, bukan deploy merah di malam hari. Image hanya terbit setelah `gate` hijau, jadi
  # image yang ada di registry selalu image yang seluruh gate-nya lulus.
  image-web:
    name: "Image: web"
    needs: [gate]
    # `always()` is what lets this job start at all: `gate` runs even when one of
    # its own needs was skipped (visual-update on a push), and a job whose needs
    # chain contains a skip is skipped itself unless its own `if` overrides that.
    # The second half keeps the ordering promise: the image is published only
    # after the gate is green.
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, job ini saja
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `${GITHUB_SHA::7}` adalah sintaks bash dan di dalam `with:` tidak ada shell, jadi buildx
      # menerima string itu apa adanya dan tag-nya tidak sah. `printf '%.7s'` juga sama persis
      # dengan `cut -c1-7` di skrip deploy, yang `rev-parse --short` tidak selalu hasilkan.
      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # GIT_REV = SHA penuh dengan sengaja: nilainya ditulis ke /healthz di dalam image.
          build-args: |
            GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/nferdazel/kran-web:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/kran-web:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/kran-web@${DIGEST}"

  # Image API kran: dibangun di sini, bukan di host. `deploy-vps.sh` menarik tag sha-<7>,
  # memeriksa label revisinya, men-tag :local/:prev, lalu mengekstrak biner untuk gate.
  # Konteks build = root repo: sumber Nim tersebar di shared/, modules/, apps/, tools/.
  image-api:
    name: "Image: api"
    needs: [gate]
    # See image-web: without `always()` a skipped need of `gate` propagates into
    # this job, and the tag never appears for the host to pull.
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, job ini saja
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/nferdazel/kran-api:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/kran-api:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/kran-api@${DIGEST}"

  # Satu nama yang dibaca branch protection, dan satu-satunya yang menentukan
  # apakah image boleh terbit. Gate hanya bergantung pada job kualitas, tidak
  # pernah pada job image: deploy tidak boleh mulai sebelum semua pemeriksaan
  # hijau, tapi image harus terbit sesudah putusan itu, jadi keduanya tidak bisa
  # saling menunggu. Skrip deploy di host memang sudah menunggu check
  # `Image: web` dan `Image: api`, jadi urutannya tetap: gate, image, deploy.
  gate:
    name: "Gate"
    if: always()
    needs: [contract, nim-check, traceability, db-tests, ci-fast, web-e2e, security, visual-update]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_CONTRACT: ${{ needs.contract.result }}
      R_NIM: ${{ needs.nim-check.result }}
      R_TRACE: ${{ needs.traceability.result }}
      R_DB: ${{ needs.db-tests.result }}
      R_CIFA: ${{ needs.ci-fast.result }}
      R_WEB: ${{ needs.web-e2e.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_VISUAL: ${{ needs.visual-update.result }}
    steps:
      - name: "Gate: require every job"
        shell: bash
        run: |
          fail=0
          for r in "$R_CONTRACT" "$R_NIM" "$R_TRACE" "$R_DB" "$R_CIFA" "$R_WEB" "$R_SECURITY"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          # `visual-update` hanya jalan saat diminta (workflow_dispatch + update_snapshots),
          # jadi `skipped` adalah hasil normal di push ke main, bukan kegagalan.
          case "$R_VISUAL" in success|skipped) ;; *) echo "visual job: $R_VISUAL"; fail=1 ;; esac
          exit "$fail"
