name: Secret scan (riwayat penuh)

# Gerbang tambahan, bukan pengganti job `security` di `ci.yml`: job itu memindai commit yang
# di-push (atau rentang PR), sedangkan job ini memindai **seluruh riwayat** setiap minggu.
# Alasannya konkret: rahasia yang lolos ke riwayat tidak bisa dibereskan tanpa menulis ulang
# history, jadi lebih murah menemukannya cepat lewat pemindaian berkala.
#
# Dijalankan juga manual: `gh workflow run "Secret scan (riwayat penuh)"`.

on:
  schedule:
    # Senin 03:17 UTC (Senin 10:17 WIB) — di luar jam deploy biasa.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: gitleaks (--log-opts=--all)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (seluruh riwayat)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Dipin: versi menentukan sintaks `[allowlist]` yang dikenali dan hasil pemindaian.
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -eu
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          ./gitleaks version

      - name: Scan seluruh riwayat
        run: ./gitleaks git --log-opts=--all --config .gitleaks.toml --redact --verbose
