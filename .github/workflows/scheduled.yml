# class: C
name: Scheduled checks

# The two jobs no push needs to wait for, in one file: a full-history secret scan (weekly) and the
# Linux visual baseline (manual). Both are class C — never on the push path, never a required check.
#
# Merged from `secret-scan.yml` and `visual-baseline.yml` on 2026-11-19 (CI/CD v2.0, CI-07): two
# class C files meant two concurrency groups and two places to look for "what runs on a timer".
#
# Manual runs:
#   gh workflow run scheduled.yml -f job=secret-scan
#   gh workflow run scheduled.yml -f job=visual-baseline -f update=true

on:
  schedule:
    # Senin 03:17 UTC (Senin 10:17 WIB) — di luar jam deploy biasa.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which check to run'
        type: choice
        options: [secret-scan, visual-baseline]
        default: secret-scan
      update:
        description: 'visual-baseline only: rewrite the committed baselines from this run'
        type: boolean
        default: false

permissions:
  contents: read

# One group for the file: a scheduled scan and a manual baseline run are independent, but two runs
# of the same file for one ref would only produce duplicate artefacts and no extra verdict.
concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    name: gitleaks (--log-opts=--all)
    # The weekly schedule runs this job; a manual dispatch runs it only when asked for.
    if: github.event_name == 'schedule' || inputs.job == 'secret-scan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (seluruh riwayat)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Dipin: versi menentukan sintaks `[allowlist]` yang dikenali dan hasil pemindaian.
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -eu
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz gitleaks
          ./gitleaks version

      - name: Scan seluruh riwayat
        run: ./gitleaks git --log-opts=--all --config .gitleaks.toml --redact --verbose

  # Baseline visual regression di **Linux** (O-022/D-176). Baseline yang dibuat di macOS tidak bisa
  # dipakai runner, jadi satu-satunya cara sah adalah menjalankannya di sini lalu meng-commit
  # artefaknya. Gate-nya sendiri ada di `ci.yml` job `web-e2e` (`./task e2e` ikut menjalankan
  # `visual.spec.ts`). Alur: jalankan workflow ini -> unduh artefak `visual-baseline-linux` ->
  # commit ke `apps/web/tests/e2e/visual.spec.ts-snapshots/`. Jangan menyalin baseline antar-OS.
  visual-baseline:
    name: Visual baseline (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'visual-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kran
          POSTGRES_PASSWORD: kran
          POSTGRES_DB: kran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kran -d kran_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KRAN_DATABASE_URL: postgres://kran:kran@127.0.0.1:5432/kran_test
      # Input dispatch dibaca lewat env, bukan diinterpolasi ke skrip (kontrak CI).
      UPDATE_BASELINE: ${{ github.event.inputs.update }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache browser Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser Playwright
        run: pnpm --filter @kran/web exec playwright install chromium

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Cache nimble
        uses: actions/cache@v6
        with:
          path: ~/.nimble
          key: nimble-${{ runner.os }}-2.4.2-${{ hashFiles('kran.nimble') }}

      - name: Install Nim dependencies
        run: nimble install -d -y

      - name: Runtime libs (libpcre3)
        run: sudo apt-get update -qq && sudo apt-get install -y libpcre3

      - name: Build API + prepare dev database
        run: |
          ./task build
          ./task dbtools migrate
          ./task dbtools seed --dev

      - name: Compare or update visual baselines
        # Tanpa input `update`, langkah ini membandingkan hasil render dengan baseline yang sudah
        # di-commit — bukti bahwa runner yang sama menghasilkan piksel yang sama.
        run: |
          if [ "$UPDATE_BASELINE" = "true" ]; then
            # `=all`: flag telanjang berarti mode `changed` dan tidak menulis ulang snapshot yang
            # selisihnya masih di bawah `maxDiffPixelRatio`; regenerasi harus selalu menulis.
            pnpm --filter @kran/web exec playwright test visual.spec.ts --update-snapshots=all
          else
            pnpm --filter @kran/web exec playwright test visual.spec.ts
          fi

      - name: Upload baselines
        if: env.UPDATE_BASELINE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-linux
          path: apps/web/tests/e2e/visual.spec.ts-snapshots
          if-no-files-found: error
          retention-days: 14
