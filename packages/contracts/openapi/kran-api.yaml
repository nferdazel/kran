  /api/v1/teller/sessions:
    post:
      operationId: openTellerSession
      tags: [teller]
      summary: Buka sesi kas teller
      description: |
        Membuka sesi kas untuk **pemanggil** di cabang `branchId`. Opening float didebit dari
        `teller.vault` cabang (saldo tidak boleh negatif) dan menjadi float awal laci. Satu sesi
        `OPEN` per (teller, cabang) — partial unique index; sesi `OPEN` lain → 409
        `session_already_open`.

        Tutup sesi (`POST …/sessions/{sessionId}/close`) mencatat `expected_cash`, `counted_cash`,
        dan `variance`. Buka/tutup/selisih **berjurnal** (`D 101.2 / K 101.1` sebesar float,
        `D 101.1 / K 101.2` sebesar counted, selisih ke/dari `101.9`) dan ditulis di transaksi yang
        sama dengan mutasi vault (T-118/D-132); pemetaan akun `NEEDS-COMPLIANCE-REVIEW`.

        `Idempotency-Key` wajib. Replay kunci+isi sama → 200 + `Idempotent-Replayed`; kunci sama isi
        beda → 409. Izin `teller.session.open` harus dipegang di cabang ini
        (`params.reason=branch_not_allowed` bila hanya di cabang lain). Konflik domain 409 memakai
        `params.reason`: `cash_limit_exceeded` (opening float melebihi parameter
        `teller.cash.limit_opening_float`), `session_already_open`, `insufficient_vault`,
        `vault_not_configured`.

        **HUMAN-REVIEW-REQUIRED** (mutasi vault + variance kas, AGENTS.md §8).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
