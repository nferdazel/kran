        Daftar akun urut kode. Filter `type` dan `postable` menyaring **di SQL** (bukan setelah
        batas baris), jadi hasil tidak terpotong di tengah filter. COA dimiliki institusi, bukan
        cabang. Daftar dibatasi **200 akun** (batas ukuran respons); paginasi menyusul bila COA
        tumbuh melewati itu.
      security:
        - sessionCookie: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        - name: postable
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
