openapi: 3.1.0

info:
  title: KRAN API
  version: 0.1.0
  summary: Kontrak HTTP API KRAN (koperasi, BPR/BPRS, BMT)
  description: |
    Kontrak ini adalah **sumber kebenaran** untuk API HTTP KRAN (spec §13). Handler di sisi Nim
    ditulis manual mengikuti dokumen ini, dan `apps/api/tests/tcontract.nim` + `itapi.nim`
    membuktikan implementasi ≡ kontrak (parity rute + validasi bentuk respons).

    Konvensi (spec §13):
    - Endpoint bisnis di bawah `/api/v1`; health/readiness di akar (dipakai gate deploy).
    - Uang dikirim sebagai **string desimal** (`"1500000.00"`) + `currency`, bukan number.
    - Tanggal bisnis `YYYY-MM-DD`; waktu ISO-8601 UTC.
    - Error memakai `application/problem+json` (RFC 9457) dengan `code`, `i18nKey`, `params`,
      `traceId`; pesan manusia diterjemahkan frontend dari `i18nKey`.
    - Operasi yang mengubah state memakai `Idempotency-Key`; update memakai `If-Match` (ETag).

    Tahap Fase 0: dokumen ini **tumbuh bersama implementasi** — pada T-008 hanya memuat endpoint
    sistem (kesehatan); T-009 menambah realtime, T-012 menambah auth/parameter/audit. Setiap
    operasi yang ada di sini wajib dilayani implementasi (dijaga contract test).

    Peristiwa realtime (amplop WebSocket) punya skema sendiri di `packages/contracts/events`
    (spec §12.4), bukan sebagai operasi HTTP.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Pemilik produk KRAN
    url: https://github.com/nferdazel/kran

servers:
  - url: /
    description: Server yang sama dengan aplikasi web (BFF); lihat `ops/caddy/Caddyfile`.

tags:
  - name: system
    description: Kesehatan proses — dipakai systemd, webhook deploy, dan smoke test.
  - name: realtime
    description: |
      Peristiwa platform untuk UI (spec §19). Transport: WebSocket (ADR-002/D-019).
  - name: auth
    description: Sesi login (spec §13, §18.2) — masuk, identitas, keluar.
  - name: params
    description: |
      Parameter efektif-dated dengan maker-checker (spec §10.2, §10.4): pengajuan butuh penyetuju
      lain, dan nilai aktif lama dipangkas saat nilai baru disetujui.
  - name: audit
    description: Jejak audit append-only ber-rantai hash (spec §9.1(7), §18.2).
  - name: ledger
    description: |
      Buku besar: Chart of Accounts dan periode akuntansi (Fase 1, T-072). Jurnal double-entry,
      saldo, dan trial balance menyusul di T-073/T-075.
  - name: product
    description: |
      Katalog produk parametrik & effective-dated (spec §9, T-076): atribut hanya lewat binding
      parameter, versi immutable, tidak ada tumpang tindih.
  - name: party
    description: |
      Party (CIF + identitas dasar) — Fase 1, T-070. Nomor CIF dibentuk dari parameter
      `party.cif.format`; data PII menyusul di T-071 bersama field crypto.
  - name: deposit
    description: |
      Rekening simpanan (spec §9.2, T-088a): buka + baca rekening, saldo tidak boleh negatif.
      Transaksi tunai (T-088b) & pemindahbukuan (T-088c) memposting jurnal sinkron.
  - name: teller
    description: |
      Teller (spec §9.2/§9.3, T-088b/T-088c): transaksi tunai setor/tarik + pemindahbukuan (PB)
      antar rekening simpanan. Jurnal double-entry diposting **sinkron** di transaksi DB yang sama
      dengan mutasi saldo; event outbox hanya non-akuntansi.
  - name: user
    description: |
      Administrasi pengguna & role (spec §9.2, T-117): daftar akun operator, katalog role, dan
      siklus hidup akun (tugaskan/cabut role, nonaktifkan/aktifkan/buka kunci). Butuh izin
      `platform.user.manage` **dan** grant tanpa batas cabang (aksi tingkat institusi).
  - name: platform
    description: |
      Data master platform: cabang (kode 3 digit + nama). Baca saja; pembuatan dan perubahan
      tetap lewat `ctl create-branch` (D-130).

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness proses
      description: |
        Selalu 200 selama proses HTTP hidup dan melayani permintaan. Tidak menyentuh DB:
        liveness tidak boleh gagal karena DB mati (spec §21.4 #11).
      security: []
      responses:
        "200":
          description: Proses hidup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Method tidak diizinkan untuk path ini
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /readyz:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Kesiapan melayani trafik
      description: |
        Memeriksa dependensi yang wajib. Dipakai gate deploy (`ops/scripts/deploy-vps.sh`)
        untuk memutuskan lanjut atau rollback (spec §21.4 #11, §22).
      security: []
      responses:
        "200":
          description: Siap melayani
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Belum siap (salah satu pemeriksaan gagal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "405":
          description: Method tidak diizinkan untuk path ini
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [realtime]
      summary: Langganan peristiwa realtime (WebSocket)
      description: |
        Menaikkan koneksi HTTP ke WebSocket dan mengalirkan peristiwa outbox. Skema amplop pesan
        ada di `packages/contracts/events/realtime-envelope.v1.schema.json`.

        Pesan dari klien: `{"type":"subscribe","topics":["param.changed"],"resumeFrom":"<id>"}`
        dan `{"type":"unsubscribe"}`. Balasan `subscribed` memuat topik yang disetujui, topik yang
        **ditolak** (eksplisit, bukan dibuang diam-diam), dan jumlah peristiwa yang diputar ulang.

        Resume: `resumeFrom` = `id` peristiwa terakhir yang diterima klien. Server memutar ulang
        dari outbox sehingga reconnect tidak kehilangan peristiwa (spec §19.2). Bila peristiwa yang
        terlewat melebihi batas replay, server mengirim `{"type":"resync"}` dan klien harus
        menyegarkan keadaan lewat HTTP.

        Otorisasi: identitas dari cookie sesi `kran_session` (spec §13) atau header
        `Authorization: Bearer`; topik difilter izin per langganan. Selama sesi belum terpasang
        (T-012), kebijakan default menolak semua koneksi.

        Permintaan tanpa `Upgrade: websocket` dibalas 426 — endpoint ini tidak melayani HTTP biasa.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "101":
          description: Koneksi dinaikkan ke WebSocket; lanjutan komunikasi memakai amplop peristiwa.
        "401":
          description: Tidak ada identitas sesi
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Identitas tidak diizinkan membuka stream
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          description: Method tidak diizinkan untuk path ini
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "426":
          description: Permintaan bukan WebSocket upgrade
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          description: Layanan realtime tidak dikonfigurasi (mis. tanpa koneksi DB saat start)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Masuk dan buat sesi
      description: |
        Memverifikasi kredensial dan membuat sesi. Token sesi dikirim **hanya** lewat cookie
        `HttpOnly`+`Secure`+`SameSite=Strict` (spec §13) — tidak ada salinan di badan respons.

        Kata sandi **selalu diverifikasi lebih dulu** — akun tak dikenal pun mengerjakan KDF
        berbiaya setara, supaya waktu responsnya tidak membedakan akun ada/tidak. Salah kata sandi
        dijawab 401 `invalid_credentials` (termasuk bila percobaan itu yang barusan mengunci akun);
        kata sandi benar tetapi akun terkunci/tidak aktif dijawab 403 dengan `params.reason`
        `locked`/`inactive`. Jadi keadaan akun hanya diberitahukan kepada orang yang memang memegang
        kata sandinya, dan badan respons tidak mengungkap keberadaan akun kepada yang lain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "415":
          $ref: "#/components/responses/Problem"
        "200":
          description: Sesi dibuat; cookie `kran_session` diset
          headers:
            Set-Cookie:
              description: Cookie sesi (`HttpOnly`, `Secure`, `SameSite=Strict`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          description: Kredensial tidak cocok
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Akun terkunci atau tidak aktif (`params.reason` = `locked`/`inactive`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            Terlalu banyak percobaan login dari alamat ini (`params.reason` = `rate_limited`).
            Pembatasnya melindungi kapasitas KDF/pool, bukan kebijakan akun: akun yang benar pun
            ditolak selama jendela berjalan.
          headers:
            Retry-After:
              description: Detik sampai percobaan berikutnya diterima
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Identitas sesi yang sedang aktif
      description: |
        Mengembalikan pengguna, peran, dan izin efektif sesi pada cookie. Sekaligus memperpanjang
        batas idle sesi (spec §18.2) — dipakai UI sebagai denyut saat memuat halaman.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "200":
          description: Sesi sah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Cabut sesi dan hapus cookie
      description: |
        Mencabut sesi pada cookie dan mengirim cookie kedaluwarsa (`Max-Age=0`). Setelah ini
        token lama tidak lagi sah (`revoked_at` terisi) — bukan sekadar dihapus di browser.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "204":
          description: Sesi dicabut; cookie dihapus (`Max-Age=0`)
          headers:
            Set-Cookie:
              description: Cookie sesi kedaluwarsa
              schema:
                type: string
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Ganti kata sandi sendiri
      description: |
        Mengganti kata sandi pengguna yang sedang masuk. Kata sandi lama wajib benar; kata sandi
        baru dinilai kebijakan (panjang minimum dari parameter institusi, tidak sama dengan
        username, tanpa spasi). Sesi yang dipakai **tetap hidup**, sedangkan sesi lain milik
        pengguna yang sama dicabut — kalau kata sandi diganti karena diduga bocor, sesi lama tidak
        boleh melanjutkan.

        Rute ini (bersama `getSession` dan `logout`) tetap bisa dipakai walaupun
        `SessionInfo.mustChangePassword` masih `true`; rute lain menjawab 403 dengan
        `params.reason` = `password_change_required` sampai kata sandinya diganti.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "204":
          description: Kata sandi diganti; sesi lain dicabut
        "400":
          description: |
            Badan permintaan tidak lengkap, atau kata sandi baru melanggar kebijakan
            (`params.reason` = `password_policy`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Kata sandi lama tidak cocok (`params.reason` = `old_password_mismatch`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/mfa:
    get:
      operationId: getMfaStatus
      tags: [auth]
      summary: Status MFA akun sendiri
      description: |
        Status pendaftaran faktor kedua (TOTP) milik pemanggil: `NONE` (belum pernah mendaftar),
        `PENDING` (rahasia ada, belum dikonfirmasi kode), `ACTIVE` (terkonfirmasi).

        `featureEnabled` mencerminkan parameter institusi `platform.security.mfa.enabled`, yang
        **default `false`**. Selama `false`, ketiga rute MFA menjawab 403 dengan `params.reason` =
        `mfa_disabled`. **Alur login belum meminta MFA** (D-046 butir 9): faktor terdaftar pun tidak
        mengubah proses masuk pada tahap ini.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "200":
          description: Status pendaftaran MFA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatusResponse"
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: MFA belum diaktifkan (`params.reason` = `mfa_disabled`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/mfa/enrolment:
    post:
      operationId: startMfaEnrolment
      tags: [auth]
      summary: Mulai pendaftaran TOTP (rahasia dikembalikan sekali)
      description: |
        Membuat pendaftaran baru berstatus `PENDING` dan mengembalikan rahasia base32 + URI
        `otpauth://` untuk dimasukkan ke aplikasi authenticator. Rahasia **hanya** ada di respons
        ini; di DB tersimpan sebagai ciphertext (field crypto, AAD `user_mfa`) dan tidak pernah bisa
        dibaca lagi lewat API.

        Memanggil ulang saat masih `PENDING` mengganti rahasia lama (belum pernah dikonfirmasi).
        Bila faktor sudah `ACTIVE`, rute ini menjawab 409 dengan `params.reason` =
        `mfa_already_active` — mengganti faktor aktif adalah operasi pemulihan yang belum punya
        alurnya (O-071), bukan efek samping pendaftaran.

        Butuh `KRAN_KEK_FILE` terkonfigurasi; tanpa itu rute menjawab 501 alih-alih menulis
        rahasia tanpa enkripsi.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "201":
          description: Pendaftaran dibuat; rahasia hanya dikembalikan di sini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrolmentResponse"
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: MFA belum diaktifkan (`params.reason` = `mfa_disabled`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: MFA sudah aktif untuk akun ini (`params.reason` = `mfa_already_active`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfaEnrolment
      tags: [auth]
      summary: Konfirmasi kode TOTP untuk mengaktifkan pendaftaran
      description: |
        Memverifikasi satu kode terhadap pendaftaran `PENDING` akun pemanggil. Kode benar →
        status menjadi `ACTIVE` dan langkah waktunya dicatat (menolak pemakaian ulang kode yang
        sama). Digit/periode yang dipakai adalah bentuk yang **tercatat saat pendaftaran**, bukan
        nilai parameter saat ini: mengubah parameter tidak membatalkan rahasia yang sudah ada.

        Kode salah menjawab 403 dengan `params.reason` = `mfa_code_invalid` (bukan 401: sesinya
        sah, yang salah hanya kodenya) dan tetap dicatat di audit
        (`auth.mfa.verify_failure`) tanpa memuat kode.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "204":
          description: Kode benar; pendaftaran menjadi ACTIVE
        "400":
          description: Badan permintaan tidak lengkap
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Tidak ada sesi sah
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            MFA belum diaktifkan (`params.reason` = `mfa_disabled`) atau kode tidak cocok
            (`params.reason` = `mfa_code_invalid`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Tidak ada pendaftaran menunggu (`params.reason` = `mfa_no_pending_enrolment`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/params:
    get:
      operationId: listParams
      tags: [params]
      summary: Daftar nilai parameter
      description: |
        Nilai parameter beserta statusnya (`ACTIVE`, `PENDING`, `SUPERSEDED`, `REJECTED`) untuk UI
        Parameter Admin (spec §10.7). Filter `status=PENDING` = daftar yang menunggu checker.
        Hasilnya **disaring per scope** menurut wewenang pembaca (D-046 butir 6, D-055): nilai
        ber-scope `BRANCH`/`PRODUCT`/`SEGMENT`/`ROLE` hanya terlihat bila grant-nya menutupinya.
        Pembacaan lintas cabang tetap boleh, tetapi dicatat (`param.read_cross_branch`).
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, PENDING, ACTIVE, SUPERSEDED, REJECTED]
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "200":
          description: Daftar nilai parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParamValueList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/params/{key}/changes:
    post:
      operationId: submitParamChange
      tags: [params]
      summary: Ajukan perubahan parameter (maker)
      description: |
        Mengajukan nilai baru untuk sebuah parameter. Hasilnya **selalu** `PENDING`: aktivasi
        butuh penyetuju lain (spec §10.2, maker-checker). Nilai divalidasi terhadap definisi
        (tipe + JSON Schema + scope yang diizinkan).

        `reason` wajib: audit perubahan parameter harus bisa menjelaskan alasannya (spec §11.7).
        `effectiveFrom` kosong = tanggal buku hari ini.

        Penolakan tingkat-field datang sebagai 400/403 dengan `params.reason` berkode stabil
        (dipetakan UI, O-045): `idempotency_key_required` (header wajib tidak dikirim/kosong),
        `value_missing`, `reason_missing`, `effective_from_invalid`,
        `effective_to_invalid`, `period_invalid`, `scope_id_required`, `scope_id_forbidden`,
        `value_invalid`, `invalid_combination` (bertentangan dengan parameter lain yang aktif),
        `effective_to_without_successor` (tanggal berakhir tidak ditutup nilai penerus, O-043), dan
        dua penolakan wewenang 403: `scope_not_readable` (scope di luar wewenang **baca** pengaju,
        D-047) serta `branch_not_allowed` (nilai ber-scope `BRANCH` di cabang di luar wewenang
        **pengajuan**, T-058 — aksi tingkat institusi juga menuntut grant tanpa batas cabang).
      security:
        - sessionCookie: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Kunci parameter, mis. `platform.security.max_failed_logins`.
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParamChangeRequest"
      responses:
        "503":
