      summary: Trial balance per periode
      description: |
        Agregat debit/kredit per akun untuk periode yang diberikan, dihitung **langsung dari
        `journal_line`** (bukan cache `balance_snapshot`). Total debit dan total kredit harus sama;
        akun tanpa pergerakan tidak muncul. Izin: `ledger.journal.read` (tingkat institusi).
      security:
        - sessionCookie: []
      parameters:
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/ledger/balances:
    get:
      operationId: getLedgerBalances
      tags: [ledger]
      summary: Saldo GL per periode (opening/period/closing)
      description: |
        Saldo per akun untuk periode yang diberikan: `opening` (kumulatif sebelum `startsOn`),
        `period` (mutasi dalam rentang **inklusif** `startsOn`..`endsOn`), dan `closing`
        (= opening + mutasi), dengan debit dan kredit **terpisah** (bukan saldo bersih).
        Hanya akun yang bergerak di periode atau bersaldo awal ≠ 0 yang muncul; akun tanpa
        mutasi **dan** tanpa saldo awal tetap absen. Angka dihitung dari `journal_line`
        (sumber kebenaran).
        `source=ledger` untuk perhitungan langsung dari jurnal; `source=snapshot` bila periode
        sudah CLOSED dan cache `balance_snapshot` pada `endsOn` sudah terekonsiliasi dengan
        jurnal (D-096). Izin: `ledger.journal.read` (tingkat institusi).
      security:
        - sessionCookie: []
      parameters:
        - name: periodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Saldo GL per akun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerBalances"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/products:
    get:
      operationId: listProducts
      tags: [product]
      summary: Daftar produk
      description: |
        Katalog produk + versi yang berlaku pada `asOf` (default tanggal bisnis institusi).
        Produk tanpa versi yang berlaku pada tanggal itu tetap muncul dengan `currentVersion: null`.
      security:
        - sessionCookie: []
      parameters:
        - name: asOf
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProduct
      tags: [product]
      summary: Buat produk + versi pertama
      description: |
        Membuat produk baru beserta versi 1 (terbuka). Setiap atribut **wajib** berupa binding ke
        parameter terdaftar (`product.*`) dan divalidasi terhadap definisi parameter (tipe, enum,
        batas numerik). Menerbitkan event `ProductPublished`.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/products/{code}:
    get:
      operationId: getProduct
      tags: [product]
      summary: Detail produk + versi
      description: |
        Detail produk beserta seluruh versi dan binding parameternya. Versi bersifat immutable;
        perubahan atribut = versi baru, bukan edit baris lama.
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail produk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/products/{code}/versions:
    post:
      operationId: createProductVersion
      tags: [product]
      summary: Versi produk baru
      description: |
        Menerbitkan versi baru mulai `effectiveFrom`. Versi terbuka sebelumnya ditutup sehari
        sebelum tanggal itu. Versi tidak boleh tumpang tindih (dijaga EXCLUDE di DB). Menerbitkan
        event `ProductPublished`.
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductVersionCreate"
      responses:
        "201":
          description: Versi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kran_session
      description: |
        Sesi login (spec §13): cookie `HttpOnly`, `Secure`, `SameSite=Lax`. Header
        `Authorization: Bearer <token>` juga diterima untuk klien non-browser.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: |
        Kunci idempotensi per pemanggil (D-098). Wajib pada endpoint pembuat objek: kirim ulang
        dengan kunci yang sama untuk mengulang permintaan tanpa membuat objek ganda. Replay
        dijawab 200 + header `Idempotent-Replayed: true`; kunci sama dengan isi berbeda → 409.
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id party (UUID).

  headers:
    IdempotentReplayed:
      description: Ada dan bernilai `true` bila respons ini adalah replay permintaan sebelumnya.
      schema:
        type: string
        enum: ["true"]

  responses:
    Problem:
      description: Error dengan amplop RFC 9457 (`application/problem+json`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, uptimeSeconds, role]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Versi aplikasi (dari konfigurasi saat start).
        uptimeSeconds:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [api, worker, ctl, migrate]
          description: Role proses yang sedang berjalan (spec §12.5, §21.4).

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Nama pemeriksaan, mis. `database`, `migrations`.
        status:
          type: string
          enum: [ok, failed]
        detail:
          type: string
          description: Keterangan singkat saat gagal (tanpa data sensitif).

    Problem:
      type: object
      additionalProperties: false
      description: |
        Amplop error RFC 9457 (spec §13). `i18nKey` menunjuk katalog pesan frontend; `params`
        memuat nilai untuk placeholder pesan itu (tanpa data sensitif).
      required: [type, title, status, code, i18nKey, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI tipe problem, mis. `/problems/param-not-found`.
        title:
          type: string
          description: Ringkasan singkat (log/diagnostik).
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Penjelasan tambahan untuk operator (bukan untuk pengguna akhir).
        code:
          type: string
          description: Kode mesin yang stabil, mis. `PARAM_NOT_FOUND`.
        i18nKey:
          type: string
          description: Kunci katalog i18n untuk pesan pengguna, mis. `error_param_not_found`.
        params:
          type: object
          additionalProperties:
            type: string
          description: Placeholder untuk `i18nKey`.
        traceId:
          type: string
          description: Korelasi dengan log & audit (spec §18.2).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          writeOnly: true

    MfaStatusResponse:
      type: object
      additionalProperties: false
      required: [featureEnabled, status]
      properties:
        featureEnabled:
          type: boolean
          description: |
            Nilai parameter `platform.security.mfa.enabled` (default `false`) — bukan status akun.
        status:
          type: string
          enum: [NONE, PENDING, ACTIVE]

    MfaEnrolmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, digits, periodSeconds]
      properties:
        secret:
          type: string
          description: |
            Rahasia TOTP base32 (RFC 4648, tanpa padding), 160 bit. **Hanya dikembalikan sekali**;
            setelahnya tidak ada endpoint yang bisa membacanya kembali.
        otpauthUri:
          type: string
          description: URI `otpauth://totp/...` untuk dimasukkan ke aplikasi authenticator.
        digits:
          type: integer
          minimum: 6
          maximum: 10
        periodSeconds:
          type: integer
          minimum: 15
          maximum: 300

    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          writeOnly: true

    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, sessionId, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          description: Batas idle sesi (ISO-8601 UTC).

    SessionInfo:
      type: object
      additionalProperties: false
      required: [userId, username, fullName, mustChangePassword, roles, permissions, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
            description: Kode izin `modul.resource.action` (spec §13).
        expiresAt:
          type: string
          description: Batas idle sesi (ISO-8601 UTC); batas absolut tidak pernah dilampaui.

    ParamValue:
      type: object
      additionalProperties: false
      required: [paramValueId, key, scopeType, scopeId, status, value, effectiveFrom,
                 effectiveTo, maker, checker, reason, requiresApproval]
      properties:
        paramValueId:
          type: string
          format: uuid
        key:
          type: string
        scopeType:
          type: string
          enum: [GLOBAL, INSTITUTION, BRANCH, PRODUCT, SEGMENT]
        scopeId:
          type: string
        status:
          type: string
          enum: [DRAFT, PENDING, ACTIVE, SUPERSEDED, REJECTED]
        value:
          description: Nilai parameter; bentuknya ditentukan JSON Schema definisinya.
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          description: Kosong = berlaku tanpa batas akhir.
        maker:
          type: string
        checker:
          type: string
        reason:
          type: string
        requiresApproval:
          type: boolean

    ParamValueList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParamValue"

    ParamChangeRequest:
      type: object
      additionalProperties: false
      required: [value, reason]
      properties:
        value:
          description: Nilai baru; divalidasi terhadap tipe & JSON Schema definisi parameter.
        scopeType:
          type: string
          enum: [GLOBAL, INSTITUTION, BRANCH, PRODUCT, SEGMENT]
          default: GLOBAL
        scopeId:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        reason:
          type: string
          minLength: 1

    ParamSubmitResponse:
      type: object
      additionalProperties: false
      required: [paramValueId, key, status, scopeType, scopeId, value, effectiveFrom,
                 effectiveTo, reason]
      properties:
        paramValueId:
          type: string
          format: uuid
        key:
          type: string
        status:
          type: string
          enum: [PENDING]
        scopeType:
          type: string
        scopeId:
          type: string
        value:
          description: Nilai yang diajukan (belum aktif sampai disetujui).
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        reason:
          type: string

    ParamApprovalResponse:
      type: object
      additionalProperties: false
      required: [paramValueId, status]
      properties:
        paramValueId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE]

    ParamRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Alasan penolakan; disimpan di audit (`param.reject`).

    ParamRejectResponse:
      type: object
      additionalProperties: false
      required: [paramValueId, status]
      properties:
        paramValueId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REJECTED]

    AuditItem:
      type: object
      additionalProperties: false
      required: [seq, recordedAt, businessDate, actorUserId, actorRole, action, resourceType,
                 resourceId, reason, after]
      properties:
        seq:
          type: integer
          minimum: 1
        recordedAt:
          type: string
          description: ISO-8601 UTC (zona tetap, bukan zona server).
        businessDate:
          type: string
          description: Tanggal buku saat aksi terjadi (`YYYY-MM-DD`); kosong bila belum ada.
        actorUserId:
          type: string
        actorRole:
          type: string
        action:
          type: string
          description: Mis. `param.submit`, `param.approve`, `auth.login.success`.
        resourceType:
          type: string
        resourceId:
          type: string
        reason:
          type: string
        after:
          description: Nilai sesudah aksi (bentuk mengikuti action).

    AuditList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditItem"

    PartyCreate:
      type: object
      additionalProperties: false
      required: [kind, displayName, branchId]
      properties:
        kind:
          type: string
          enum: [PERSON, ORG]
          description: Jenis party. Detail orang/lembaga menyusul di T-071.
        displayName:
          type: string
          minLength: 2
          maxLength: 200
          description: Nama tampil party (PII; tidak diterbitkan ke event).
        branchId:
          type: string
          format: uuid
          description: Cabang pemilik party (izin dan audit mengikuti cabang ini).

    Party:
      type: object
      additionalProperties: false
      required: [partyId, cif, kind, displayName, status, branchId, createdAt]
      properties:
        partyId:
          type: string
          format: uuid
        cif:
          type: string
          description: Nomor CIF dari parameter `party.cif.format` + sequence.
        kind:
          type: string
          enum: [PERSON, ORG]
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        branchId:
          type: string
          format: uuid
        createdAt:
          type: string
          description: ISO-8601 UTC.

    IdentityDocCreate:
      type: object
      additionalProperties: false
      required: [docType, number]
      properties:
        docType:
          type: string
          description: Harus termasuk daftar parameter `party.identity.doc_types`.
        number:
          type: string
          maxLength: 64
          description: |
            Nomor dokumen apa adanya; server menormalkan (huruf besar, hanya A-Z0-9) sebelum
            dienkripsi. Nilai ini tidak pernah dikembalikan utuh kecuali lewat *unmask*.
        issuedAt:
          type: ["string", "null"]
          description: |
            Tanggal terbit `YYYY-MM-DD` (opsional; `null`/absen bila tidak dicatat). Bentuk
            tanggal tidak sah dijawab 400, bukan 500.
        expiresAt:
          type: ["string", "null"]
          description: |
            Tanggal kedaluwarsa `YYYY-MM-DD` (opsional). Tidak boleh lebih awal dari `issuedAt`
            (dijawab 400).

    IdentityDoc:
      type: object
      additionalProperties: false
      required: [docId, docType, numberLast2, issuedAt, expiresAt, createdAt]
      properties:
        docId:
          type: string
          format: uuid
        docType:
          type: string
        numberLast2:
          type: string
          description: Dua karakter terakhir nomor (bentuk tersamar untuk UI).
        issuedAt:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
          description: ISO-8601 UTC.

    IdentityDocUnmasked:
      type: object
      additionalProperties: false
      required: [docId, docType, number, expiresAt]
      properties:
        docId:
          type: string
          format: uuid
        docType:
          type: string
        number:
          type: string
          description: Nomor asli (ternormalisasi). Setiap pembacaan diaudit.
        expiresAt:
          type: ["string", "null"]

    UnmaskRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Alasan pembukaan data (masuk jejak audit, bukan opsional).

    KycProfileView:
      type: object
      additionalProperties: false
      required: [partyId, status, riskLevel, riskAssessedAt, nextReviewDue, documents, riskHistory]
      properties:
        partyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        riskLevel:
          type: string
          description: Tingkat risiko berjalan (anggota `party.kyc.risk_levels`).
        riskAssessedAt:
          type: ["string", "null"]
          description: ISO-8601 UTC; `null` bila belum pernah dinilai.
        nextReviewDue:
          type: ["string", "null"]
          description: Tanggal re-KYC berikutnya (`YYYY-MM-DD`).
        documents:
          type: array
          description: Maksimum 50 dokumen pertama menurut `createdAt` (batas teknis respons).
          items:
            $ref: "#/components/schemas/IdentityDoc"
        riskHistory:
          type: array
          description: Maksimum 50 penilaian terbaru (batas teknis respons, bukan aturan bisnis).
          items:
            $ref: "#/components/schemas/RiskRatingItem"

    RiskRatingItem:
      type: object
      additionalProperties: false
      required: [ratingId, level, reason, assessedAt, assessedBy]
      properties:
        ratingId:
          type: string
          format: uuid
        level:
          type: string
        reason:
          type: string
        assessedAt:
          type: string
          description: ISO-8601 UTC.
        assessedBy:
          type: string
          format: uuid

    RiskRatingCreate:
      type: object
      additionalProperties: false
      required: [level, reason]
      properties:
        level:
          type: string
          description: Harus termasuk daftar parameter `party.kyc.risk_levels`.
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RiskRatingView:
      type: object
      additionalProperties: false
      required: [ratingId, partyId, level, reason, assessedAt, nextReviewDue]
      properties:
        ratingId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        level:
          type: string
        reason:
          type: string
        assessedAt:
          type: string
          description: ISO-8601 UTC.
        nextReviewDue:
          type: ["string", "null"]

    CoaCreate:
      type: object
      additionalProperties: false
      required: [code, name, accountType]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Harus cocok dengan parameter `ledger.coa.code_pattern`.
        name:
          type: string
          minLength: 2
          maxLength: 200
        accountType:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        postable:
          type: boolean
          default: true
          description: |
            `false` untuk akun header/induk yang tidak boleh dipakai posting jurnal (T-073).

    CoaAccount:
      type: object
      additionalProperties: false
      required: [accountId, code, name, accountType, normalSide, postable, status, createdAt]
      properties:
        accountId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        accountType:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        normalSide:
          type: string
          enum: [DEBIT, CREDIT]
          description: Invarian dari `accountType` — bukan masukan pemanggil.
        postable:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          description: ISO-8601 UTC.

    CoaList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CoaAccount"

    PeriodCreate:
      type: object
      additionalProperties: false
      required: [startsOn, endsOn]
      properties:
        startsOn:
          type: string
          format: date
          description: Tanggal mulai `YYYY-MM-DD` (inklusif).
        endsOn:
          type: string
          format: date
          description: Tanggal akhir `YYYY-MM-DD` (inklusif); tidak boleh sebelum `startsOn`.

    Period:
      type: object
      additionalProperties: false
      required: [periodId, startsOn, endsOn, status, closedAt, closedBy, createdAt]
      properties:
        periodId:
          type: string
          format: uuid
        startsOn:
          type: string
        endsOn:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
        closedAt:
          type: ["string", "null"]
          description: ISO-8601 UTC; `null` selama periode masih OPEN.
        closedBy:
          type: ["string", "null"]
          description: UUID penutup; `null` selama periode masih OPEN.
        createdAt:
          type: string
          description: ISO-8601 UTC.

    PeriodList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Period"

    PeriodCloseRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Alasan penutupan; masuk jejak audit.

    JournalLine:
      type: object
      additionalProperties: false
      required: [lineNo, glAccount, branchId, debit, credit]
      properties:
        lineNo:
          type: integer
          minimum: 1
        glAccount:
          type: string
        branchId:
          type: string
          format: uuid
        debit:
          type: string
          description: Desimal 4 angka di belakang koma, mis. `1500.0000`.
        credit:
          type: string
          description: Desimal 4 angka di belakang koma; tepat satu dari debit/credit > 0.

    JournalHeader:
      type: object
      additionalProperties: false
      required: [journalId, businessDate, valueDate, sourceEvent, sourceRef, idempotencyKey,
                 reversalOf, recordedAt]
      properties:
        journalId:
          type: string
          format: uuid
        businessDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        sourceEvent:
          type: string
        sourceRef:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        reversalOf:
          type: ["string", "null"]
          description: UUID jurnal asal bila jurnal ini pembalik; `null` bila bukan.
        recordedAt:
          type: string
          description: ISO-8601 UTC.

    Journal:
      type: object
      additionalProperties: false
      required: [journalId, businessDate, valueDate, sourceEvent, sourceRef, idempotencyKey,
                 reversalOf, recordedAt, lines, totalDebit, totalCredit]
      properties:
        journalId:
          type: string
          format: uuid
        businessDate:
          type: string
          format: date
        valueDate:
          type: string
          format: date
        sourceEvent:
          type: string
        sourceRef:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        reversalOf:
          type: ["string", "null"]
        recordedAt:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
        totalDebit:
          type: string
        totalCredit:
          type: string

    JournalList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JournalHeader"

    JournalReversalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    TrialBalanceLine:
      type: object
      additionalProperties: false
      required: [accountCode, accountName, accountType, debit, credit]
      properties:
        accountCode:
          type: string
        accountName:
          type: string
        accountType:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        debit:
          type: string
        credit:
          type: string

    TrialBalance:
      type: object
      additionalProperties: false
      required: [periodId, startsOn, endsOn, totalDebit, totalCredit, lines]
      properties:
        periodId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        totalDebit:
          type: string
        totalCredit:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TrialBalanceLine"

    LedgerBalanceLine:
      type: object
      additionalProperties: false
      required: [accountCode, accountName, accountType, openingDebit, openingCredit,
                 periodDebit, periodCredit, closingDebit, closingCredit]
      properties:
        accountCode:
          type: string
        accountName:
          type: string
        accountType:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        openingDebit:
          description: Kumulatif debit sebelum periode (desimal 4, string tanpa float).
          type: string
        openingCredit:
          type: string
        periodDebit:
          description: Mutasi debit dalam periode (rentang inklusif).
          type: string
        periodCredit:
          type: string
        closingDebit:
          description: openingDebit + periodDebit.
          type: string
        closingCredit:
          description: openingCredit + periodCredit.
          type: string

    LedgerBalances:
      type: object
      additionalProperties: false
      required: [periodId, startsOn, endsOn, source, computedAt, lines]
      properties:
        periodId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        source:
          description: |
            `ledger` = dihitung dari jurnal; `snapshot` = periode CLOSED yang cache-nya pada
            `endsOn` terekonsiliasi dengan jurnal.
          type: string
          enum: [ledger, snapshot]
        computedAt:
          description: Waktu perhitungan (ISO-8601 UTC).
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LedgerBalanceLine"

    ParamBinding:
      type: object
      additionalProperties: false
      required: [paramKey, value]
      properties:
        paramKey:
          type: string
        value:
          description: Nilai JSON sesuai tipe parameter (money/decimal/rate berupa string desimal).

    ProductVersion:
      type: object
      additionalProperties: false
      required: [versionId, versionNo, effectiveFrom, effectiveTo, bindings]
      properties:
        versionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [ "string", "null" ]
          format: date
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ParamBinding"

    ProductVersionRef:
      type: object
      additionalProperties: false
      required: [versionNo, effectiveFrom]
      properties:
        versionNo:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date

    Product:
      type: object
      additionalProperties: false
      required: [productId, code, name, productType, createdAt, versions]
      properties:
        productId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        createdAt:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ProductVersion"

    ProductSummary:
      type: object
      additionalProperties: false
      required: [productId, code, name, productType, createdAt, currentVersion]
      properties:
        productId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        createdAt:
          type: string
        currentVersion:
          oneOf:
            - $ref: "#/components/schemas/ProductVersionRef"
            - type: "null"

    ProductList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    ProductCreate:
      type: object
      additionalProperties: false
      required: [code, name, productType, effectiveFrom, bindings]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        effectiveFrom:
          type: string
          format: date
        bindings:
          type: object
          description: Peta `paramKey` → nilai.
          additionalProperties: true

    ProductVersionCreate:
      type: object
      additionalProperties: false
      required: [effectiveFrom, bindings]
      properties:
        effectiveFrom:
          type: string
          format: date
        bindings:
          type: object
          additionalProperties: true
