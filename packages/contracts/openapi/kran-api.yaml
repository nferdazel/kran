          description: ISO-8601 UTC (zona tetap, bukan zona server).
        businessDate:
          type: string
          description: Tanggal buku saat aksi terjadi (`YYYY-MM-DD`); kosong bila belum ada.
        actorUserId:
          type: string
        actorRole:
          type: string
        action:
          type: string
          description: Mis. `param.submit`, `param.approve`, `auth.login.success`.
        resourceType:
          type: string
        resourceId:
          type: string
        reason:
          type: string
        after:
          description: Nilai sesudah aksi (bentuk mengikuti action).

    AuditList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditItem"

    PartyCreate:
      type: object
      additionalProperties: false
      required: [kind, displayName, branchId]
      properties:
        kind:
          type: string
          enum: [PERSON, ORG]
          description: Jenis party. Detail orang/lembaga menyusul di T-071.
        displayName:
          type: string
          minLength: 2
          maxLength: 200
          description: Nama tampil party (PII; tidak diterbitkan ke event).
        branchId:
          type: string
          format: uuid
          description: Cabang pemilik party (izin dan audit mengikuti cabang ini).

    Party:
      type: object
      additionalProperties: false
      required: [partyId, cif, kind, displayName, status, branchId, createdAt]
      properties:
        partyId:
          type: string
          format: uuid
        cif:
          type: string
          description: Nomor CIF dari parameter `party.cif.format` + sequence.
        kind:
          type: string
          enum: [PERSON, ORG]
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        branchId:
          type: string
          format: uuid
        createdAt:
          type: string
          description: ISO-8601 UTC.

    PartySummary:
      type: object
      additionalProperties: false
      description: |
        Bentuk ringkas party untuk pencarian (T-115): hanya field yang dibutuhkan pemilih pemilik
        rekening. Tanpa identitas/KYC dan tanpa `createdAt`.
      required: [partyId, cif, kind, displayName, status, branchId]
      properties:
        partyId:
          type: string
          format: uuid
        cif:
          type: string
        kind:
          type: string
          enum: [PERSON, ORG]
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        branchId:
          type: string
          format: uuid

