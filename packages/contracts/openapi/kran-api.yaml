          format: date
        source:
          description: |
            `ledger` = dihitung dari jurnal; `snapshot` = periode CLOSED yang cache-nya pada
            `endsOn` terekonsiliasi dengan jurnal.
          type: string
          enum: [ledger, snapshot]
        computedAt:
          description: Waktu perhitungan (ISO-8601 UTC).
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LedgerBalanceLine"

    ParamBinding:
      type: object
      additionalProperties: false
      required: [paramKey, value]
      properties:
        paramKey:
          type: string
        value:
          description: Nilai JSON sesuai tipe parameter (money/decimal/rate berupa string desimal).

    ProductVersion:
      type: object
      additionalProperties: false
      required: [versionId, versionNo, effectiveFrom, effectiveTo, status, approvedAt, rejectReason, bindings]
      properties:
        versionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [ "string", "null" ]
          format: date
        status:
          type: string
          enum: [DRAFT, ACTIVE, REJECTED]
          description: "Siklus hidup versi (D-119): DRAFT → ACTIVE (approve) atau REJECTED (reject)."
        approvedAt:
          type: [ "string", "null" ]
          description: Waktu persetujuan (ISO 8601 UTC); null selama belum disetujui.
        rejectReason:
          type: [ "string", "null" ]
          description: Alasan penolakan; null kecuali status REJECTED.
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/ParamBinding"

    ProductVersionRef:
      type: object
      additionalProperties: false
      required: [versionNo, effectiveFrom]
      properties:
        versionNo:
          type: integer
          minimum: 1
        effectiveFrom:
          type: string
          format: date

    SavingsKind:
      description: |
        Klasifikasi simpanan koperasi (T-111): `POKOK`, `WAJIB`, `SUKARELA`, atau `TABUNGAN`.
        `null` = **belum terklasifikasi** (rekening/produk lama) — jangan memberi label palsu.
        Hanya sah untuk produk berjenis `SAVINGS`; mengisinya untuk tipe lain → 400, dan
        reklasifikasi = produk baru (nilai immutable).
      type: [ "string", "null" ]
      enum: [POKOK, WAJIB, SUKARELA, TABUNGAN, null]

    Product:
      type: object
      additionalProperties: false
      required: [productId, code, name, productType, createdAt, versions]
      properties:
        productId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        savingsKind:
          $ref: "#/components/schemas/SavingsKind"
        createdAt:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ProductVersion"

    ProductSummary:
      type: object
      additionalProperties: false
      required: [productId, code, name, productType, createdAt, currentVersion]
      properties:
        productId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        savingsKind:
          $ref: "#/components/schemas/SavingsKind"
        createdAt:
          type: string
        currentVersion:
          oneOf:
            - $ref: "#/components/schemas/ProductVersionRef"
            - type: "null"

    ProductList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    ProductCreate:
      type: object
      additionalProperties: false
      required: [code, name, productType, effectiveFrom, bindings]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 120
        productType:
          type: string
          enum: [SAVINGS, TIME_DEPOSIT, LOAN, FINANCING]
        savingsKind:
          $ref: "#/components/schemas/SavingsKind"
        effectiveFrom:
          type: string
          format: date
        bindings:
          type: object
          description: Peta `paramKey` → nilai.
          additionalProperties: true

    ProductVersionCreate:
      type: object
      additionalProperties: false
      required: [effectiveFrom, bindings]
      properties:
        effectiveFrom:
          type: string
          format: date
        bindings:
          type: object
          additionalProperties: true

    ProductVersionReject:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Alasan penolakan; tersimpan di audit dan pada versi (`rejectReason`).

    DepositAccountCreate:
      type: object
      additionalProperties: false
      required: [partyId, productCode, branchId]
      properties:
        partyId:
          type: string
          format: uuid
          description: Party pemilik rekening (harus berstatus `ACTIVE`).
        productCode:
          type: string
          description: Kode produk berjenis `SAVINGS` yang punya versi `ACTIVE` berlaku.
        branchId:
          type: string
          format: uuid
          description: Cabang rekening; harus sama dengan cabang party (kalau tidak → 409).

    DepositAccount:
      type: object
      additionalProperties: false
      required: [accountId, accountNo, partyId, productId, productCode, productVersionId,
                 branchId, accountType, status, balance, openedOn, createdAt]
      properties:
        accountId:
          type: string
          format: uuid
        accountNo:
          type: string
          description: |
            Nomor rekening **provisoris**: 10 digit zero-padded dari sequence, tanpa check digit
            (**NEEDS-COMPLIANCE-REVIEW** sampai bentuk final ditetapkan).
        partyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productCode:
          type: string
        productVersionId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        accountType:
          type: string
          enum: [SAVINGS]
        savingsKind:
          $ref: "#/components/schemas/SavingsKind"
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        balance:
          type: string
          description: Saldo desimal string 2 desimal (tanpa float), mis. `"0.00"`.
        openedOn:
          type: string
          format: date
        createdAt:
          type: string
          description: ISO-8601 UTC.

    DepositAccountList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DepositAccount"

    CashTransactionCreate:
      type: object
      additionalProperties: false
      required: [accountId, direction, amount]
      properties:
        accountId:
          type: string
          format: uuid
          description: Rekening simpanan (harus berstatus `ACTIVE`).
        direction:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
          description: Setor (masuk kas) atau tarik (keluar kas).
        amount:
          type: string
          description: Nominal desimal string > 0 (tanpa float), mis. `"100000.00"`.
        narration:
          type: string
          maxLength: 200
          description: Keterangan opsional (batas teknis kolom 200 karakter).

    CashTransaction:
      type: object
      additionalProperties: false
      required: [transactionId, journalId, direction, amount, balanceAfter, businessDate]
      properties:
        transactionId:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
          description: Jurnal double-entry yang diposting sinkron untuk transaksi ini.
        direction:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: string
          description: Nominal desimal string 2 desimal (tanpa float).
        balanceAfter:
          type: string
          description: Saldo rekening setelah transaksi, desimal string 2 desimal.
        businessDate:
          type: string
          format: date
          description: Tanggal buku transaksi (`YYYY-MM-DD`).

    CashTransactionSlip:
      type: object
      additionalProperties: false
      description: |
        Transaksi tunai untuk cetak ulang slip (T-094a). **Tanpa** `balanceAfter`: saldo per transaksi
        tidak disimpan, dan menghitung saldo berjalan dari subledger akan mengarang data (D-127).
      required: [transactionId, journalId, direction, amount, businessDate, accountNo, narration]
      properties:
        transactionId:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
          description: Jurnal double-entry yang diposting sinkron untuk transaksi ini.
        direction:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: string
          description: Nominal desimal string 2 desimal (tanpa float).
        businessDate:
          type: string
          format: date
          description: Tanggal buku transaksi (`YYYY-MM-DD`).
        accountNo:
          type: string
          description: |
            Nomor rekening **provisoris** (10 digit) seperti pada `DepositAccount`
            (**NEEDS-COMPLIANCE-REVIEW** sampai bentuk final ditetapkan).
        narration:
          type: string
          description: Keterangan transaksi; `""` bila tidak diisi.

    AccountStatement:
      type: object
      additionalProperties: false
      description: |
        Subledger satu rekening untuk rentang tanggal (T-094b). **Bukan** rekonsiliasi GL dan
        **tanpa** saldo berjalan per baris.
      required: [accountNo, status, branchId, from, to, rows]
      properties:
        accountNo:
          type: string
          description: Nomor rekening **provisoris** (10 digit).
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        branchId:
          type: string
          format: uuid
        from:
          type: string
          format: date
          description: Awal rentang (inklusif).
        to:
          type: string
          format: date
          description: Akhir rentang (inklusif).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StatementRow"

    StatementRow:
      type: object
      additionalProperties: false
      description: |
        Satu baris statement. `kind` membedakan sumber; tepat satu dari `transactionId` (CASH) atau
        `transferId` (TRANSFER) terisi, yang lain `null`. `direction` relatif ke rekening yang
        diminta: `IN` = masuk, `OUT` = keluar.
      required: [kind, direction, amount, businessDate, journalId, narration, transactionId,
                 transferId]
      properties:
        kind:
          type: string
          enum: [CASH, TRANSFER]
        direction:
          type: string
          enum: [IN, OUT]
        amount:
          type: string
          description: Nominal desimal string 2 desimal (tanpa float).
        businessDate:
          type: string
          format: date
        journalId:
          type: string
          format: uuid
        narration:
          type: string
          description: Keterangan transaksi; `""` bila tidak diisi.
        transactionId:
          type: [ "string", "null" ]
          format: uuid
          description: Id transaksi tunai (kind `CASH`); `null` untuk baris PB.
        transferId:
          type: [ "string", "null" ]
          format: uuid
          description: Id pemindahbukuan (kind `TRANSFER`); `null` untuk baris tunai.

    TransferCreate:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amount]
      properties:
        sourceAccountId:
          type: string
          format: uuid
          description: Rekening sumber dana (harus berstatus `ACTIVE`).
        destinationAccountId:
          type: string
          format: uuid
          description: Rekening tujuan (harus `ACTIVE` dan **berbeda** dari sumber).
        amount:
          type: string
          description: Nominal desimal string > 0 (tanpa float), mis. `"100000.00"`.
        narration:
          type: string
          maxLength: 200
          description: Keterangan opsional (batas teknis kolom 200 karakter).

    Transfer:
      type: object
      additionalProperties: false
      required:
        - transferId
        - journalId
        - sourceAccountId
        - destinationAccountId
        - amount
        - sourceBalanceAfter
        - destinationBalanceAfter
        - businessDate
      properties:
        transferId:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
          description: Jurnal double-entry yang diposting sinkron untuk PB ini.
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          type: string
          description: Nominal desimal string 2 desimal (tanpa float).
        sourceBalanceAfter:
          type: string
          description: Saldo rekening sumber setelah PB, desimal string 2 desimal.
        destinationBalanceAfter:
          type: string
          description: Saldo rekening tujuan setelah PB, desimal string 2 desimal.
        businessDate:
          type: string
          format: date
          description: Tanggal buku PB (`YYYY-MM-DD`).

    TellerSessionOpenRequest:
      type: object
      additionalProperties: false
      required: [branchId, openingFloat]
      properties:
        branchId:
          type: string
          format: uuid
          description: Cabang sesi kas; izin `teller.session.open` harus dipegang di sini.
        openingFloat:
          type: string
          description: Float awal laci sebagai desimal string ≥ 0 (tanpa float), mis. `"500000.00"`.
        note:
          type: string
          maxLength: 200
          description: Catatan opsional (batas teknis kolom 200 karakter).

    TellerSession:
      type: object
      additionalProperties: false
      required: [sessionId, tellerId, branchId, businessDate, status, openingFloat, openedAt, note]
      properties:
        sessionId:
          type: string
          format: uuid
        businessDate:
          type: string
          format: date
          description: |
            Tanggal bisnis sesi. `GET /sessions/current` mengembalikan sesi OPEN apa pun tanggalnya;
            bila tanggalnya bukan tanggal bisnis hari ini, transaksi tunai ditolak
            `session_business_date_mismatch` sampai sesi itu ditutup.
        tellerId:
          type: string
          format: uuid
          description: Pengguna teller pemilik sesi.
        branchId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN]
        openingFloat:
          type: string
          description: Float awal laci, desimal string 2 desimal (tanpa float).
        openedAt:
          type: string
          description: ISO-8601 UTC.
        note:
          type: string
          maxLength: 200
          description: Catatan sesi ("" bila tidak diisi).

    TellerSessionCloseRequest:
      type: object
      additionalProperties: false
      required: [countedCash]
      properties:
        countedCash:
          type: string
          description: Kas fisik hasil hitung sebagai desimal string ≥ 0 (tanpa float).
        note:
          type: string
          maxLength: 200
          description: Catatan opsional (mis. alasan selisih kas).

    TellerSessionClose:
      type: object
      additionalProperties: false
      required: [sessionId, businessDate, status, openingFloat, countedCash, expectedCash, variance, closedAt, note]
      properties:
        sessionId:
          type: string
          format: uuid
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum: [CLOSED]
        openingFloat:
          type: string
          description: Float awal laci, desimal string 2 desimal (tanpa float).
        countedCash:
          type: string
          description: Kas fisik yang dihitung, desimal string 2 desimal.
        expectedCash:
          type: string
          description: |
            Kas yang seharusnya ada: `openingFloat` + Σ `CASH_IN` − Σ `CASH_OUT`, desimal string.
        variance:
          type: string
          description: |
            `countedCash − expectedCash` sebagai desimal string; positif = kas lebih, negatif =
            kas kurang. Bukan error: selisih dicatat + diaudit.
        closedAt:
          type: string
          description: ISO-8601 UTC.
        note:
          type: string
          maxLength: 200
          description: Catatan sesi ("" bila tidak diisi).

    TellerVault:
      type: object
      additionalProperties: false
      required: [branchId, balance]
      properties:
        branchId:
          type: string
          format: uuid
        balance:
          type: string
          description: Saldo kas fisik vault cabang, desimal string 2 desimal (tanpa float).

    TellerVaultTopUpRequest:
      type: object
      additionalProperties: false
      required: [branchId, amount, sourceAccount, note]
      properties:
        branchId:
          type: string
          format: uuid
          description: Cabang yang vault-nya diisi; izin `teller.vault.submit` harus dipegang di sini.
        amount:
          type: string
          description: Nominal top-up sebagai desimal string > 0 (tanpa float), mis. `"5000000.00"`.
        sourceAccount:
          type: string
          maxLength: 32
          description: Kode COA akun sumber dana (wajib ASSET, aktif, postable), mis. `"102"`.
        note:
          type: string
          maxLength: 200
          description: Alasan/bukti sumber dana (wajib, tidak boleh kosong).

    TellerVaultTopUpRecord:
      type: object
      additionalProperties: false
      required: [requestId, branchId, amount, sourceAccount, note, status, requestedBy,
                 decidedBy, decidedAt, decisionNote, journalId, createdAt]
      properties:
        requestId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        amount:
          type: string
          description: Nominal pengajuan, desimal string 2 desimal.
        sourceAccount:
          type: string
        note:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        requestedBy:
          type: string
          format: uuid
        decidedBy:
          type: string
          description: Kosong selama `PENDING`.
        decidedAt:
          type: string
          description: Kosong selama `PENDING`; ISO-8601 UTC bila sudah diputuskan.
        decisionNote:
          type: string
          description: Alasan penolakan; kosong bila disetujui atau masih `PENDING`.
        journalId:
          type: string
          description: Jurnal GL hasil persetujuan; kosong selama `PENDING`/`REJECTED`.
        createdAt:
          type: string
          description: ISO-8601 UTC.

    TellerVaultTopUpRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TellerVaultTopUpRecord"

    TellerVaultTopUpApproval:
      type: object
      additionalProperties: false
      required: [request, balanceAfter]
      properties:
        request:
          $ref: "#/components/schemas/TellerVaultTopUpRecord"
        balanceAfter:
          type: string
          description: Saldo vault setelah persetujuan, desimal string 2 desimal.

    TellerVaultTopUpRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 200
          description: Alasan penolakan (wajib).

    TellerVaultTopUpRejection:
      type: object
      additionalProperties: false
      required: [request]
      properties:
        request:
          $ref: "#/components/schemas/TellerVaultTopUpRecord"
