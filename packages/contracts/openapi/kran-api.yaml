          description: Daftar jurnal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/ledger/journals/{journalId}:
    get:
      operationId: getJournal
      tags: [ledger]
      summary: Detail jurnal + baris
      description: |
        Header jurnal beserta seluruh barisnya. Jurnal immutable: tidak ada endpoint edit/hapus;
        koreksi dilakukan lewat jurnal pembalik.
      security:
        - sessionCookie: []
      parameters:
        - name: journalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Jurnal beserta baris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/ledger/journals/{journalId}/reversal:
    post:
      operationId: reverseJournal
      tags: [ledger]
      summary: Jurnal pembalik
      description: |
        Membuat jurnal baru dengan `reversalOf` = jurnal asal dan debit/kredit **ditukar**, pada
        tanggal bisnis asal. Hanya jika periode tanggal itu masih OPEN dan jurnal belum pernah
        dibalik. **Idempoten**: permintaan ulang dengan `Idempotency-Key` yang sama mengembalikan
        jurnal pembalik yang sudah ada (200); kunci sama untuk jurnal asal lain → 409.
        Tidak ada endpoint edit/hapus — DB menolak UPDATE/DELETE pada jurnal.
      security:
        - sessionCookie: []
      parameters:
        - name: journalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalReversalRequest"
      responses:
        "201":
          description: Jurnal pembalik dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "200":
          description: Permintaan ulang dengan kunci yang sama (idempoten)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

