  /api/v1/parties/{partyId}/identity-docs:
    post:
      operationId: addIdentityDoc
      tags: [party]
      summary: Registrasi dokumen identitas party
      description: |
        Nomor dokumen disimpan **terenkripsi** (field-level, AAD = nama tabel) dengan *blind index*
        untuk deteksi duplikat; respons ini hanya memuat dua karakter terakhir. Butuh izin
