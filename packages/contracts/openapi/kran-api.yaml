          type: string
        checker:
          type: string
        reason:
          type: string
        requiresApproval:
          type: boolean

    ParamValueList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ParamValue"

    ParamChangeRequest:
      type: object
      additionalProperties: false
      required: [value, reason]
      properties:
        value:
          description: Nilai baru; divalidasi terhadap tipe & JSON Schema definisi parameter.
        scopeType:
          type: string
          enum: [GLOBAL, INSTITUTION, BRANCH, PRODUCT, SEGMENT]
          default: GLOBAL
        scopeId:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        reason:
          type: string
