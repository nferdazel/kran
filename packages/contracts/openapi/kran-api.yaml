  /api/v1/ledger/journals/{journalId}/reversal:
    post:
      operationId: reverseJournal
      tags: [ledger]
      summary: Jurnal pembalik
      description: |
        Membuat jurnal baru dengan `reversalOf` = jurnal asal dan debit/kredit **ditukar**, pada
        tanggal bisnis asal. Hanya jika periode tanggal itu masih OPEN dan jurnal belum pernah
        dibalik. **Idempoten**: permintaan ulang dengan `Idempotency-Key` yang sama mengembalikan
        jurnal pembalik yang sudah ada (200); kunci sama untuk jurnal asal lain → 409.
        Tidak ada endpoint edit/hapus — DB menolak UPDATE/DELETE pada jurnal.
      security:
        - sessionCookie: []
      parameters:
        - name: journalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalReversalRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "201":
          description: Jurnal pembalik dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "200":
          description: Permintaan ulang dengan kunci yang sama (idempoten)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            Konflik: jurnal sudah pernah dibalik, jurnal asal adalah jurnal pembalik (tidak bisa
            dibalik lagi), `Idempotency-Key` sudah dipakai untuk jurnal lain, periode tanggal
            bisnis jurnal sudah ditutup, akun jurnal tidak `postable`/aktif, atau jurnal milik
            subledger. Kasus terakhir menjawab `params.reason` = `journal_owned_by_subledger` +
            `params.subledger` (`deposit.transaction`, `deposit.transfer`,
            `teller.teller_session`, `teller.vault_topup_request`): pembalik hanya memutar GL,
            sedangkan saldo rekening/vault/sesi tidak ikut berubah, jadi koreksi harus lewat modul
            asal.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"

