    UserRoleAssignment:
      type: object
      additionalProperties: false
      required: [userId, role, branchId]
      properties:
        userId:
          type: string
          format: uuid
        role:
          type: string
        branchId:
          type: [string, "null"]
          format: uuid

    UserStatusChange:
      type: object
      additionalProperties: false
      required: [userId, status]
      properties:
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, INACTIVE, LOCKED, SUSPENDED]

    ParamValue:
      type: object
      additionalProperties: false
