            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodCloseRequest"
      responses:
        "200":
          description: Periode tertutup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Period"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/ledger/journals:
    get:
      operationId: listJournals
      tags: [ledger]
      summary: Daftar jurnal
      description: |
        Header jurnal (tanpa baris), urut tanggal bisnis terbaru, dibatasi **200**. Jurnal tidak
        bisa dibuat/diubah/dihapus lewat HTTP: pembuatan berasal dari posting rule/event (T-074),
