      tags: [ledger]
      summary: Daftar periode akuntansi
      description: |
        Periode akuntansi urut tanggal mulai terbaru, dibatasi **200 periode**. Rentang bersifat
        **inklusif** (`startsOn`..`endsOn`); tumpang tindih ditolak DB.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Daftar periode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: openPeriod
      tags: [ledger]
      summary: Buka periode
      description: |
        Membuka periode baru. Periode yang tumpang tindih dengan periode mana pun ditolak **409**
        oleh exclusion constraint (`period_no_overlap`), bukan oleh pemeriksaan aplikasi.
        Urutan penutupan (EOD/EOM) diatur `daycloser`, bukan endpoint ini.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodCreate"
      responses:
        "201":
          description: Periode dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Period"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
