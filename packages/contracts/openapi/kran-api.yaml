              schema:
                $ref: "#/components/schemas/ParamSubmitResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            Kunci idempotensi sudah dipakai untuk permintaan lain (isi/operasi berbeda). Duplikat
            konkuren tidak sampai ke sini: permintaan kedua menunggu transaksi pemenang lalu
            dijawab replay 200 (D-117).
          content:
            application/problem+json:
              schema:
