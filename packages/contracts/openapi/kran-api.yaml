        scopeType:
          type: string
        scopeId:
          type: string
        value:
          description: Nilai yang diajukan (belum aktif sampai disetujui).
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
        reason:
          type: string

    ParamApprovalResponse:
      type: object
      additionalProperties: false
      required: [paramValueId, status]
      properties:
        paramValueId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE]

    ParamRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
