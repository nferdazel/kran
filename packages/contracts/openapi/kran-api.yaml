        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TellerSessionOpenRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: |
            Replay permintaan sebelumnya: `Idempotency-Key` sama dengan isi yang sama. Body adalah
            respons asli yang tersimpan; vault tidak didebit lagi.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TellerSession"
        "201":
          description: Sesi kas dibuka + vault didebit opening float
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TellerSession"
