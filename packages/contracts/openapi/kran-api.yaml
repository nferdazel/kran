        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaAccount"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
