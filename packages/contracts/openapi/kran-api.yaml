  /api/v1/params/changes/{paramValueId}/approve:
    post:
      operationId: approveParamChange
      tags: [params]
      summary: Setujui perubahan parameter (checker)
      description: |
        Mengaktifkan nilai `PENDING` menjadi `ACTIVE` dan memangkas nilai aktif sebelumnya
        (`SUPERSEDED`). Penyetuju **wajib berbeda** dari pengaju — ditegakkan skema DB
        (`self_approval`), bukan hanya kode. Konflik periode (EXCLUDE) juga ditolak.
        Menyetujui berarti bertindak di cabang nilai itu, jadi izin penyetuju harus menutupi cabang
        tersebut: bila tidak, dibalas 403 dengan `params.reason = branch_not_allowed` (T-058)
        **sebelum** alasan 409 diperiksa. Nilai tingkat institusi (`scopeType` selain `BRANCH`)
        menuntut grant **tanpa** batas cabang — grant khusus cabang tidak cukup.
      security:
        - sessionCookie: []
      parameters:
        - name: paramValueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "200":
          description: Nilai diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParamApprovalResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: "paramValueId tidak ditemukan"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            Tidak bisa disetujui: bukan `PENDING` (`params.reason` = `not_pending`), pengesahan
            sendiri (`self_approval`), periode bertabrakan (`period_conflict`), nilai itu
            melanggar aturan lintas-parameter saat digabung nilai lain yang aktif
            (`invalid_combination`, mis. `session_idle_minutes` > `session_absolute_minutes`),
            atau penerusnya hilang lagi sebelum persetujuan (`effective_to_without_successor`,
            O-043).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

  /api/v1/params/changes/{paramValueId}/reject:
    post:
      operationId: rejectParamChange
      tags: [params]
      summary: Tolak perubahan parameter (checker)
      description: |
        Menolak nilai `PENDING` menjadi `REJECTED`. Nilai yang sedang `ACTIVE` tidak disentuh.
        Penolakan menulis audit `param.reject` + event `param.changed` dalam transaksi yang sama,
        sehingga pengajuan yang salah tidak perlu dibiarkan menumpuk atau diubah lewat SQL.
        Alasan wajib (maksimum 500 karakter) dan disimpan di audit. Penolak bertindak di cabang
        nilai itu, jadi izin checker harus menutupi cabang tersebut (403 `branch_not_allowed`).
      security:
        - sessionCookie: []
      parameters:
        - name: paramValueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParamRejectRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "200":
          description: Nilai ditolak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParamRejectResponse"
        "400":
          description: "`reason` kosong atau lebih dari 500 karakter (`params.reason` = `reason_missing`/`reason_too_long`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          description: "paramValueId tidak ditemukan"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "409":
          description: |
            Tidak bisa ditolak: bukan `PENDING` (`params.reason` = `not_pending`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"

