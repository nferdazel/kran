      summary: Ajukan top-up kas vault (maker)
      description: |
        **Pengajuan**, bukan mutasi: saldo vault belum berubah. Yang disimpan nominal, akun sumber
        (`sourceAccount`, kode COA ASSET postable), alasan/bukti sumber dana (`note`, wajib), dan
