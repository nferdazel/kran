      type: object
      additionalProperties: false
      required: [docId, docType, numberLast2, issuedAt, expiresAt, createdAt]
      properties:
        docId:
          type: string
          format: uuid
        docType:
          type: string
        numberLast2:
          type: string
          description: Dua karakter terakhir nomor (bentuk tersamar untuk UI).
        issuedAt:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
          description: ISO-8601 UTC.

    IdentityDocUnmasked:
      type: object
      additionalProperties: false
      required: [docId, docType, number, expiresAt]
      properties:
