      summary: Tutup periode
      description: |
        Menutup periode OPEN: mengisi `closed_at`/`closedBy`, menulis audit `ledger.period.close`
        dan event `period.closed` dalam transaksi yang sama. **Alasan wajib**. Periode yang sudah
        tertutup → 409.
      security:
        - sessionCookie: []
      parameters:
        - name: periodId
          in: path
          required: true
