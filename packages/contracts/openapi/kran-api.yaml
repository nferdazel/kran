  /api/v1/teller/cash-transactions:
    post:
      operationId: postCashTransaction
      tags: [teller]
      summary: Setor atau tarik tunai
      description: |
        Mencatat transaksi tunai (`direction` = `DEPOSIT` atau `WITHDRAWAL`) pada satu rekening
        simpanan. Mutasi saldo, jurnal double-entry (dari posting rule), baris transaksi, audit, dan
        event outbox ditulis dalam **satu** transaksi DB; jurnal diposting **sinkron**, bukan lewat
        worker outbox. Saldo minimum dari binding versi produk akun (`product.savings.min_balance`,
        default 0).

        `Idempotency-Key` wajib. Replay kunci+isi sama → 200 + `Idempotent-Replayed`; kunci sama isi
        beda → 409. Panjang efektif kunci maksimal **156** karakter (kunci jurnal menambah 44
        karakter: `teller:` + UUID pemanggil + `:`); lebih dari itu → 400. Izin `teller.transaction.post` harus dipegang di **cabang rekening**
        (`params.reason=branch_not_allowed` bila hanya di cabang lain). Konflik domain 409 memakai
        `params.reason`: `no_open_session` (tidak ada sesi kas `OPEN` untuk teller di cabang rekening),
        `session_business_date_mismatch` (sesi `OPEN` ada tetapi untuk tanggal bisnis lain; tutup
        sesi itu dulu), `cash_limit_exceeded` (nominal melebihi parameter
        `teller.cash.limit_deposit`/`teller.cash.limit_withdrawal`), `account_not_active`,
        `insufficient_funds`, `period_closed`,
        `savings_kind_locked` (penarikan dari rekening bersimpanan pokok/wajib belum didukung;
        saldo & jurnal tidak berubah).

        Rekening bersimpanan pokok/wajib (`savingsKind` POKOK/WAJIB) memakai akun ekuitas terpisah
        (`301.1`/`301.2`, **provisional**, `NEEDS-COMPLIANCE-REVIEW`) untuk setoran; rekening lain
        tetap `201`.

        **HUMAN-REVIEW-REQUIRED** (jalur finansial, AGENTS.md §8).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashTransactionCreate"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: |
            Replay permintaan sebelumnya: `Idempotency-Key` sama dengan isi yang sama. Body adalah
            respons asli yang tersimpan; tidak ada transaksi/jurnal baru.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
        "201":
          description: Transaksi tercatat + jurnal diposting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransaction"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/teller/cash-transactions/{transactionId}:
    get:
      operationId: getCashTransactionSlip
      tags: [teller]
      summary: Baca satu transaksi tunai untuk cetak ulang slip
      description: |
        Transaksi tunai yang sudah tercatat, untuk cetak ulang slip (mis. printer macet) **tanpa**
        mengulang transaksi. Izin `deposit.account.read` harus dipegang di cabang rekening; id tidak
        ada — atau id bukan transaksi tunai (mis. id PB) — → 404.

        `balanceAfter` sengaja **tidak** ada: saldo per transaksi tidak disimpan, dan saldo berjalan
        dihitung dari jurnal (bukan subledger). Isi yang dikembalikan: nomor rekening, arah, nominal,
        tanggal buku, jurnal, dan narasi.
      security:
        - sessionCookie: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Transaksi tunai untuk slip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashTransactionSlip"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/teller/transfers:
    post:
      operationId: postTransfer
      tags: [teller]
      summary: Pemindahbukuan (PB) antar rekening simpanan
      description: |
        Memindahbukukan saldo dari `sourceAccountId` ke `destinationAccountId` (keduanya rekening
        simpanan `ACTIVE` dan berbeda). Saldo sumber & tujuan, jurnal double-entry (dari posting
        rule `DepositTransferred`), baris `deposit.transfer`, audit, dan event outbox ditulis dalam
        **satu** transaksi DB; jurnal diposting **sinkron**, bukan lewat worker outbox.

        **Batas akuntansi:** kedua sisi GL memakai akun `201` (kewajiban simpanan) yang sama, jadi
        jurnal PB net-nol di buku besar; perpindahan per rekening dicatat di `deposit.transfer`
        (lihat `MODULE.md` + `docs/ACCEPTED-LIMITS.md`). Saldo minimum dari binding versi produk
        rekening **sumber** (`product.savings.min_balance`, default 0).

        `Idempotency-Key` wajib. Replay kunci+isi sama → 200 + `Idempotent-Replayed`; kunci sama isi
        beda → 409. Panjang efektif kunci maksimal **156** karakter (kunci jurnal menambah 44
        karakter: `teller:` + UUID pemanggil + `:`); lebih dari itu → 400. Izin
        `teller.transaction.post` harus dipegang di **kedua** cabang rekening
        (`params.reason=branch_not_allowed` bila hanya di cabang lain). Konflik domain 409 memakai
        `params.reason`: `account_not_active`, `insufficient_funds`, `period_closed`,
        `savings_kind_locked` (PB yang menyentuh rekening bersimpanan pokok/wajib, di sisi mana pun, belum didukung),
        `transfer_kind_mismatch` (jenis simpanan sumber dan tujuan berbeda). Saat 409 saldo & jurnal
        tidak berubah.

        **HUMAN-REVIEW-REQUIRED** (jalur finansial, AGENTS.md §8).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: |
            Replay permintaan sebelumnya: `Idempotency-Key` sama dengan isi yang sama. Body adalah
            respons asli yang tersimpan; tidak ada transfer/jurnal baru.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "201":
          description: Pemindahbukuan tercatat + jurnal diposting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [user]
      summary: Daftar akun operator
      description: |
        Daftar akun operator beserta role efektifnya (kode + cabang; `branchId: null` = grant
        tingkat institusi). **Tanpa** password hash dan tanpa data sesi. Hasil tidak disaring per
        cabang: pengelolaan pengguna adalah aksi tingkat institusi (izin `platform.user.manage`
        harus dipegang tanpa batas cabang; `403` `params.reason=branch_not_allowed` bila hanya
        grant bercabang yang dimiliki).
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Daftar akun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/branches:
    get:
      operationId: listBranches
      tags: [platform]
      summary: Master cabang
      description: |
        Daftar cabang (kode 3 digit + nama), urut kode. Kode adalah prefiks nomor rekening
        (D-130). Baca saja: tidak ada rute untuk membuat atau mengubah cabang.

        Izin `platform.branch.read` cukup **dipegang** (tidak dituntut grant tanpa batas cabang),
        karena pemegang role ber-scope `BRANCH` justru pengguna yang butuh daftar ini. Daftar tidak
        disaring per cabang; otorisasi per cabang tetap ditegakkan di endpoint yang menyentuh kas.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Daftar cabang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [user]
      summary: Katalog role
      description: |
        Katalog role (kode, scope, dan penanda role sistem). Dipakai layar administrasi untuk
        memutuskan bentuk penugasan: role `BRANCH` wajib menyertakan cabang, role `INSTITUTION`
        tidak boleh. Izin per role tidak dibuka di sini.
      security:
        - sessionCookie: []
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Katalog role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users/{userId}/roles:
    post:
      operationId: assignUserRole
      tags: [user]
      summary: Tugaskan role ke pengguna
      description: |
        Menugaskan `role` (opsional `branchId`) ke pengguna. Scope ditegakkan
        (`roleAssignmentProblem`): role `BRANCH` butuh cabang, role `INSTITUTION` menolaknya (`400`
        `role_scope`). Konflik pemisahan tugas ditolak `409` `sod_conflict`; role yang sudah
        dipegang `409` `already_granted`; kode role tak dikenal `400` `role_not_found`; pengguna
        tak ada `404` `user_not_found`. Penugasan kepada akun peminta sendiri ditolak `409`
        `self_grant`, dan role yang memuat izin yang tidak dipegang pemberi izin ditolak `403`
        `grant_exceeds_actor` — tanpa keduanya `platform.user.manage` setara `platform_admin`.
        Audit `user.role_grant` ditulis dengan aktor dari sesi.
        **HUMAN-REVIEW-REQUIRED** (administrasi pengguna/RBAC).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleAssignRequest"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "201":
          description: Role ditugaskan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoleAssignment"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users/{userId}/roles/{role}:
    delete:
      operationId: revokeUserRole
      tags: [user]
      summary: Cabut role dari pengguna
      description: |
        Mencabut **persis** grant yang cocok: `branchId` kosong = grant tingkat institusi, terisi =
        grant cabang itu. Role `platform_admin` terakhir tidak boleh dicabut (`409` `last_admin`)
        supaya sistem tidak kehilangan pengelola RBAC. Grant yang tidak dipegang `409`
        `not_granted`. Audit `user.role_revoke`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: role
          in: path
          required: true
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "204":
          description: Grant dicabut
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users/{userId}/disable:
    post:
      operationId: disableUser
      tags: [user]
      summary: Nonaktifkan akun (cabut seluruh sesi)
      description: |
        Menonaktifkan akun (`INACTIVE`) dan mencabut seluruh sesinya. Admin terakhir tidak boleh
        dinonaktifkan (`409` `last_admin`). Audit `user.disable`. **HUMAN-REVIEW-REQUIRED**.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Akun dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusChange"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users/{userId}/enable:
    post:
      operationId: enableUser
      tags: [user]
      summary: Aktifkan kembali akun yang dinonaktifkan
      description: |
        Hanya `INACTIVE` → `ACTIVE`; `LOCKED`/`SUSPENDED` ditolak `409` `not_inactive` (yang
        pertama memakai `unlockUser`, yang kedua butuh keputusan berbeda). Audit `user.enable`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Akun diaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusChange"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

  /api/v1/users/{userId}/unlock:
    post:
      operationId: unlockUser
      tags: [user]
      summary: Buka akun yang terkunci
      description: |
        Hanya `LOCKED` → `ACTIVE`, sekaligus mengosongkan penghitung gagal. Akun dengan status lain
        ditolak `409` `not_locked`. Audit `user.unlock`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "503":
          $ref: "#/components/responses/Problem"
        "405":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        "200":
          description: Akun dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusChange"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kran_session
      description: |
        Sesi login (spec §13): cookie `HttpOnly`, `Secure`, `SameSite=Strict`. Header
        `Authorization: Bearer <token>` juga diterima untuk klien non-browser.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: |
        Kunci idempotensi per pemanggil (D-098). Wajib pada endpoint pembuat objek: kirim ulang
        dengan kunci yang sama untuk mengulang permintaan tanpa membuat objek ganda. Replay
        dijawab 200 + header `Idempotent-Replayed: true`; kunci sama dengan isi berbeda → 409.
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id party (UUID).
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id pengguna (UUID).

  headers:
    IdempotentReplayed:
      description: Ada dan bernilai `true` bila respons ini adalah replay permintaan sebelumnya.
      schema:
        type: string
        enum: ["true"]

  responses:
    Problem:
      description: Error dengan amplop RFC 9457 (`application/problem+json`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version, uptimeSeconds, role]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Versi aplikasi (dari konfigurasi saat start).
        uptimeSeconds:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [api, worker, ctl, migrate]
          description: Role proses yang sedang berjalan (spec §12.5, §21.4).

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Nama pemeriksaan, mis. `database`, `migrations`.
        status:
          type: string
          enum: [ok, failed]
        detail:
          type: string
          description: Keterangan singkat saat gagal (tanpa data sensitif).

    Problem:
      type: object
      additionalProperties: false
      description: |
        Amplop error RFC 9457 (spec §13). `i18nKey` menunjuk katalog pesan frontend; `params`
        memuat nilai untuk placeholder pesan itu (tanpa data sensitif).
      required: [type, title, status, code, i18nKey, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI tipe problem, mis. `/problems/param-not-found`.
        title:
          type: string
          description: Ringkasan singkat (log/diagnostik).
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Penjelasan tambahan untuk operator (bukan untuk pengguna akhir).
        code:
          type: string
          description: Kode mesin yang stabil, mis. `PARAM_NOT_FOUND`.
        i18nKey:
          type: string
          description: Kunci katalog i18n untuk pesan pengguna, mis. `error_param_not_found`.
        params:
          type: object
          additionalProperties:
            type: string
          description: Placeholder untuk `i18nKey`.
        traceId:
          type: string
          description: Korelasi dengan log & audit (spec §18.2).

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          minLength: 1
          writeOnly: true
        newPassword:
          type: string
          minLength: 1
          writeOnly: true

    MfaStatusResponse:
      type: object
      additionalProperties: false
      required: [featureEnabled, status]
      properties:
        featureEnabled:
          type: boolean
          description: |
            Nilai parameter `platform.security.mfa.enabled` (default `false`) — bukan status akun.
        status:
          type: string
          enum: [NONE, PENDING, ACTIVE]

    MfaEnrolmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri, digits, periodSeconds]
      properties:
        secret:
          type: string
          description: |
            Rahasia TOTP base32 (RFC 4648, tanpa padding), 160 bit. **Hanya dikembalikan sekali**;
            setelahnya tidak ada endpoint yang bisa membacanya kembali.
        otpauthUri:
          type: string
          description: URI `otpauth://totp/...` untuk dimasukkan ke aplikasi authenticator.
        digits:
          type: integer
          minimum: 6
          maximum: 10
        periodSeconds:
          type: integer
          minimum: 15
          maximum: 300

    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          writeOnly: true

    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, sessionId, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          description: Batas idle sesi (ISO-8601 UTC).

    SessionInfo:
      type: object
      additionalProperties: false
      required: [userId, username, fullName, mustChangePassword, roles, permissions, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        fullName:
          type: string
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
            description: Kode izin `modul.resource.action` (spec §13).
        expiresAt:
          type: string
          description: Batas idle sesi (ISO-8601 UTC); batas absolut tidak pernah dilampaui.

    UserRoleGrant:
      type: object
      additionalProperties: false
      required: [role, branchId]
      properties:
        role:
          type: string
          description: Kode role (`platform.role.code`).
        branchId:
          type: [string, "null"]
          format: uuid
          description: Cabang grant; `null` = grant tingkat institusi.

    UserSummary:
      type: object
      additionalProperties: false
