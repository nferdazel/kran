  /api/v1/ledger/coa:
    get:
      operationId: listCoa
      tags: [ledger]
      summary: Daftar akun COA
      description: |
        Daftar akun urut kode. Filter `type` dan `postable` menyaring **di SQL** (bukan setelah
        batas baris), jadi hasil tidak terpotong di tengah filter. COA dimiliki institusi, bukan
        cabang. Daftar dibatasi **200 akun** (batas ukuran respons); paginasi menyusul bila COA
        tumbuh melewati itu.
      security:
        - sessionCookie: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
        - name: postable
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Daftar akun
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCoa
      tags: [ledger]
      summary: Buat akun COA
      description: |
        Kode akun dicocokkan dengan parameter `ledger.coa.code_pattern` (seluruh string). Sisi
        normal **tidak** dikirim pemanggil: diturunkan dari `accountType` (ASSET/EXPENSE = DEBIT,
        LIABILITY/EQUITY/REVENUE = CREDIT) dan dijaga CHECK DB. Kode duplikat → 409.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoaCreate"
      responses:
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaAccount"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"

