  /api/v1/teller/sessions/{sessionId}/close:
    post:
      operationId: closeTellerSession
      tags: [teller]
      summary: Tutup sesi kas teller
      description: |
        Menutup sesi kas: `expected_cash = opening_float + Σ CASH_IN − Σ CASH_OUT` (dari
        `teller.cash_movement`), `counted_cash` dari penghitungan fisik, dan
        `variance = counted_cash − expected_cash` (positif = kas lebih, negatif = kas kurang).
        Vault cabang bertambah sebesar **counted_cash** (uang fisik yang masuk vault, bukan
        expected). Selisih **bukan** 409: variance dicatat + diaudit.

        `sessionId` yang tidak dikenal → 404; sesi yang sudah `CLOSED` → 409 `session_not_open`;
        sesi milik teller lain → 409 `session_not_owned`. Izin `teller.session.close` harus dipegang
        di cabang sesi.

        `Idempotency-Key` wajib (operasi kas). Dua penutupan bersamaan diserialisasi `FOR UPDATE`:
        satu 200, satu 409, vault bertambah sekali.

        **HUMAN-REVIEW-REQUIRED** (mutasi vault + variance kas, AGENTS.md §8).
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
