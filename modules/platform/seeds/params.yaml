# Definisi parameter modul `platform` (spec §10.3).
#
# Nilai di `default_pack` adalah **nilai awal pack**, BUKAN fallback kode: aplikasi tetap
# gagal-cepat (`ParamNotFound`) bila nilai aktif tidak ada (spec §10.6).
#
# `regulatory_refs` sengaja kosong sampai register regulasi §4 diverifikasi compliance
# (docs/OPEN_ITEMS.md O-001) — jangan menebak nomor pasal.

- key: platform.security.session_idle_minutes
  type: integer
  # GLOBAL dipakai sebagai tempat nilai default pack (spec §10.2/§10.3); INSTITUTION boleh
  # menimpanya. Tanpa GLOBAL, pack tidak punya tempat menaruh nilai awal yang sah.
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 1440 }
  sensitivity: NORMAL
  default_pack: { base: 30 }

- key: platform.security.password_min_length
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 8, maximum: 64 }
  sensitivity: CRITICAL
  default_pack: { base: 12 }

# Kelas karakter yang wajib ada: huruf kecil, huruf besar, angka, simbol (selain itu).
# `1` berarti hanya panjang yang mengikat; `4` berarti keempatnya wajib.
- key: platform.security.password_min_classes
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 4 }
  sensitivity: CRITICAL
  default_pack: { base: 3 }

# Berapa kata sandi **yang sudah digantikan** tidak boleh dipakai ulang (O-052, D-046 butir 8:
# riwayat 5). `0` mematikan riwayat — hanya kata sandi yang sedang berlaku yang tidak boleh sama.
- key: platform.security.password_history_count
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 0, maximum: 24 }
  sensitivity: NORMAL
  default_pack: { base: 5 }

- key: platform.calendar.fiscal_year_start_month
  type: integer
  scopes: [GLOBAL]
  schema: { minimum: 1, maximum: 12 }
  sensitivity: NORMAL
  default_pack: { base: 1 }

# Hari kerja tidak di-hardcode: bentuk akhir pekan adalah kebijakan institusi/segmen
# (mis. Jumat–Sabtu untuk segmen tertentu). Nomor hari ISO: 1 = Senin … 7 = Minggu.
- key: platform.calendar.weekend_days
  type: json
  # Tanpa SEGMENT: nilai pack masuk scope GLOBAL (aturan seed D-009), sementara cabang yang
  # butuh pekan kerja berbeda bisa menimpanya di scope BRANCH. Variasi per segmen menyusul
  # bila memang dibutuhkan (akan mengubah aturan seed pack, bukan sekadar menambah baris).
  scopes: [GLOBAL, BRANCH]
  schema: { type: array }
  sensitivity: NORMAL
  default_pack: { base: [6, 7] }

# --- Kebijakan keamanan (T-006, spec §13/§18.2) -------------------------------------------
# Angka-angka ini adalah **kebijakan institusi**, bukan pasal regulasi. Nilai awal mengikuti
# rekomendasi umum (OWASP) — ganti sesuai kebijakan dan hasil review keamanan.

# Iterasi PBKDF2: makin tinggi makin lambat ditebak, tapi juga membebani login.
- key: platform.security.password_pbkdf2_iterations
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1000, maximum: 5000000 }
  sensitivity: NORMAL
  default_pack: { base: 600000 }

- key: platform.security.max_failed_logins
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 100 }
  sensitivity: NORMAL
  default_pack: { base: 5 }

- key: platform.security.lockout_minutes
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 1440 }
  sensitivity: NORMAL
  default_pack: { base: 30 }

# Batas atas umur sesi; `platform.security.session_idle_minutes` (sudah ada) adalah batas idle.
- key: platform.security.session_absolute_minutes
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 5, maximum: 1440 }
  sensitivity: NORMAL
  default_pack: { base: 480 }

# --- MFA TOTP (T-046, spec §13) -------------------------------------------------------------
# Saklar fitur: **default mati** (D-046 butir 9). Selama `false`, rute MFA menolak dengan
# `mfa_disabled`; alur login tidak berubah sama sekali. Mengaktifkan MFA adalah keputusan
# institusi terpisah, bukan efek samping nilai parameter ini.
- key: platform.security.mfa.enabled
  type: bool
  scopes: [GLOBAL, INSTITUTION]
  sensitivity: NORMAL
  default_pack: { base: false }

# Nama penerbit yang tampil di aplikasi authenticator (`otpauth://` label & issuer).
- key: platform.security.mfa.issuer
  type: string
  scopes: [GLOBAL, INSTITUTION]
  schema: { minLength: 1, maxLength: 64 }
  sensitivity: NORMAL
  default_pack: { base: "KRAN" }

# Bentuk kode disimpan per pendaftaran saat rahasia dibuat, jadi mengubah nilai ini hanya
# memengaruhi pendaftaran **baru** — rahasia lama tetap diverifikasi dengan bentuk lamanya.
# Batas 6..8 mengikuti RFC 4226 §5.3: "Implementations MUST extract a 6-digit code at a minimum and
# possibly 7 and 8-digit code" — di atas 8 tidak ada aplikasi authenticator yang bisa menampilkannya.
- key: platform.security.mfa.digits
  type: integer
  scopes: [GLOBAL]
  schema: { minimum: 6, maximum: 8 }
  sensitivity: NORMAL
  default_pack: { base: 6 }

- key: platform.security.mfa.period_seconds
  type: integer
  scopes: [GLOBAL]
  schema: { minimum: 15, maximum: 300 }
  sensitivity: NORMAL
  default_pack: { base: 30 }

# Toleransi jam perangkat vs server, dalam jumlah langkah (0 = hanya langkah saat ini).
- key: platform.security.mfa.drift_steps
  type: integer
  scopes: [GLOBAL]
  schema: { minimum: 0, maximum: 5 }
  sensitivity: NORMAL
  default_pack: { base: 1 }

# --- Batas protokol realtime (O-030, spec §18.2) -------------------------------------------
# Pertahanan terhadap klien yang mengirim daftar topik raksasa. **Bukan** ambang bisnis (D-021),
# tetapi disimpan sebagai parameter supaya bisa diubah per institusi tanpa mengubah kode.
# Dibaca transport saat start (`apps/api`) dan diteruskan ke lapisan application (D-030).
- key: platform.realtime.max_topics
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 1000 }
  sensitivity: NORMAL
  default_pack: { base: 32 }

- key: platform.realtime.max_topic_len
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 4096 }
  sensitivity: NORMAL
  default_pack: { base: 128 }
