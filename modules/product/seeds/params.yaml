# Definisi parameter modul `product` (spec §10.3).
#
# Ini **katalog atribut** yang boleh di-bind ke versi produk. Nilai yang dipakai suatu versi
# disimpan di `product.product_param_binding` dan divalidasi terhadap definisi di sini
# (tipe, enum, batas numerik). Tidak ada angka bisnis di kode.
#
# `provenance.class` menandai asal-usul nilai seed (D-095); tabel hasilnya di
# `packs/base/generated/param_provenance.md`.
#
# NEEDS-COMPLIANCE-REVIEW: nama/arti atribut di bawah masih contoh struktur untuk pilot; angka
# final (batas saldo minimum, biaya admin, rate akrual) menunggu keputusan pemilik/compliance.
#
# `product.savings.grace_period_days` **dikeluarkan** dari katalog ini (T-087, D-095): tidak ada
# konsumen dan semantik bisnisnya tidak boleh dikarang. Baris lama di DB ditandai deprecated oleh
# migrasi `product/0005` supaya binding ke kunci itu ditolak, bukan dibiarkan hidup.

- key: product.savings.min_balance
  type: money
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 0 }
  sensitivity: NORMAL
  provenance:
    class: komersial-konservatif
    compliance: NEEDS-COMPLIANCE-REVIEW
    note: tidak menagih; angka final menunggu pemilik
  default_pack: { base: "0.00" }

- key: product.savings.admin_fee
  type: money
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 0 }
  sensitivity: NORMAL
  provenance:
    class: komersial-konservatif
    compliance: NEEDS-COMPLIANCE-REVIEW
    note: tidak menagih; angka final menunggu pemilik
  default_pack: { base: "0.00" }

# --- Akrual simpanan (O-084, D-094): BENTUK tanpa nilai --------------------------------------
# Kunci ini sengaja **tanpa `default_pack`**: angka rate/basis/pembulatan untuk produk nyata
# menunggu keputusan compliance (`NEEDS-COMPLIANCE-REVIEW`), dan parameter tanpa nilai membuat
# pembacaan gagal-cepat alih-alih memakai default yang tidak disetujui (spec §10.6).
# Akrual sendiri adalah task day-close (Fase 3), bukan atribut produk; lihat D-094.
#
# O-084 (24 Okt 2026): yang dibekukan di sini adalah **bentuk** (tipe/batas/enum) yang mengikuti
# kode yang sudah ada — bukan nilai bisnis. Dua batas datang dari kode, bukan tebakan:
#   * `rounding_scale` ≤ `moneyScale` (2) karena penyimpanan uang adalah sen (D-136);
#   * `rounding_mode` = `HALF_EVEN` saja karena kernel hanya punya pembulatan half-to-even
#     (`shared/kernel/checkedint.nim` `divRoundHalfEven`, dipakai `Money.div` dan `applyRate`).
# Nilai yang **belum** diputuskan: rate, basis hari, skala yang dipakai suatu produk, dan kapan
# bunga diposting. Catatan: `product.savings.interest_posting` sengaja ber-`type: string` (domain
# nilai dibuka) — spec/D-094 tidak menetapkan waktu posting, jadi enum lama adalah tebakan.
- key: product.savings.interest_rate
  type: rate
  scopes: [GLOBAL, INSTITUTION]
  schema:
    maxLength: 32
    description: "persen sebagai string; presisi maksimum 4 desimal dan batas kewajaran ditegakkan kernel (rateFromPercentString), bukan di sini"
  sensitivity: NORMAL
  provenance: { class: regulasi-tidak-disemai, compliance: NEEDS-COMPLIANCE-REVIEW }

- key: product.savings.day_count_basis
  type: enum
  scopes: [GLOBAL, INSTITUTION]
  enum: [ACT_365, ACT_360, THIRTY_360]
  schema:
    enum: [ACT_365, ACT_360, THIRTY_360]
    description: "basis hari bernama spec §10.5 (act/360, 30/360, act/365); menambah basis lain = ubah definisi ini, bukan nilai bebas"
  sensitivity: NORMAL
  provenance: { class: regulasi-tidak-disemai, compliance: NEEDS-COMPLIANCE-REVIEW }

- key: product.savings.rounding_mode
  type: enum
  scopes: [GLOBAL, INSTITUTION]
  enum: [HALF_EVEN]
  schema:
    enum: [HALF_EVEN]
    description: "hanya HALF_EVEN: kernel hanya mengimplementasikan half-to-even (checkedint.divRoundHalfEven; Money.div & applyRate). Mode lain butuh kode + keputusan lebih dulu"
  sensitivity: NORMAL
  provenance: { class: regulasi-tidak-disemai, compliance: NEEDS-COMPLIANCE-REVIEW }

- key: product.savings.rounding_scale
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema:
    type: integer
    minimum: 0
    maximum: 2
    description: "0..moneyScale (2): penyimpanan uang adalah sen (D-136), jadi hasil pembulatan > 2 desimal tidak punya tempat menyimpan"
  sensitivity: NORMAL
  provenance: { class: regulasi-tidak-disemai, compliance: NEEDS-COMPLIANCE-REVIEW }

- key: product.savings.interest_posting
  type: string
  scopes: [GLOBAL, INSTITUTION]
  schema:
    maxLength: 32
    description: "domain nilai sengaja dibuka: spec/D-094 tidak menetapkan kapan bunga diposting, jadi enum lama [NONE, MONTH_END] ditarik; enum ditetapkan bersama mesin akrual (Fase 3)"
  sensitivity: NORMAL
  provenance: { class: regulasi-tidak-disemai, compliance: NEEDS-COMPLIANCE-REVIEW }
