# Definisi parameter modul `daycloser` (spec §10.3, §11.4).
#
# Semua angka di sini **teknis**: ukuran potongan kerja, jumlah percobaan, dan jeda antar
# percobaan. Tidak ada ambang bisnis (mis. batas dormant atau tarif akrual) di modul ini — itu
# milik modul pemilik task dan pack.
#
# `default_pack` adalah nilai awal pack, BUKAN fallback kode: orkestrator gagal-cepat bila nilai
# aktif tidak ada (spec §10.6).

- key: daycloser.chunk_size
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 100000 }
  sensitivity: NORMAL
  provenance:
    class: teknis
    note: "Jumlah entitas per chunk. Angka awal 1000; disetel setelah benchmark EOD (T-140)."
  default_pack: { base: 1000 }

- key: daycloser.max_attempts
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 10 }
  sensitivity: NORMAL
  provenance:
    class: teknis
    note: "Percobaan maksimum per chunk/task sebelum dinyatakan FAILED."
  default_pack: { base: 3 }

- key: daycloser.retry_backoff_seconds
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 0, maximum: 300 }
  sensitivity: NORMAL
  provenance:
    class: teknis
    note: "Jeda tetap antar percobaan. Backoff eksponensial menyusul bersama worker pool (T-140)."
  default_pack: { base: 5 }

# Kebijakan transaksi daring saat business date `CLOSING` (spec §11.5 #3).
# Spec menyebut "ditolak/antri"; antrean belum ada, jadi hanya REJECT/ALLOW yang sah. Default
# REJECT adalah pilihan paling aman: penutupan yang sedang berjalan tidak boleh disusul transaksi
# yang bisa membuat gate pasca-tutup (rekonsiliasi, TB) basi sebelum segel ditulis.
- key: daycloser.txn_policy_during_close
  type: enum
  scopes: [GLOBAL, INSTITUTION]
  enum: [REJECT, ALLOW]
  schema:
    enum: [REJECT, ALLOW]
    description: "REJECT = semua perubahan HTTP ditolak 409 saat CLOSING; ALLOW = layanan tetap jalan (risiko race ditanggung institusi)"
  sensitivity: NORMAL
  provenance:
    class: kebijakan
    compliance: NEEDS-COMPLIANCE-REVIEW
    note: "Pilihan kebijakan operasional institusi; nilai ALLOW belum diuji terhadap task penutup nyata (T-140)."
  default_pack: { base: REJECT }

# Akun yang wajib bersaldo nol sebelum penutupan (spec §11.5 #2 "suspense = 0"). Akun antar-kantor
# belum ada di COA Fase 3; yang ada adalah `101.9 SELISIH KAS` (selisih kas teller yang belum
# diselesaikan). Daftar ini parameter, bukan literal di kode, supaya institusi bisa menambah akun
# suspense lain tanpa mengubah gate. Saldo dinilai menurut `account_type` COA (aset: debit−kredit).
- key: daycloser.precheck.suspense_accounts
  type: json
  scopes: [GLOBAL, INSTITUTION]
  schema: { type: array }
  sensitivity: NORMAL
  provenance:
    class: kebijakan
    compliance: NEEDS-COMPLIANCE-REVIEW
    note: "Daftar akun selisih/suspense yang wajib nol sebelum tutup; nilai awal hanya 101.9 karena akun antar-kantor belum ada."
  default_pack: { base: ["101.9"] }

# Akun GL kewajiban yang menampung subledger simpanan (spec §11.5 #5 "saldo subledger = GL").
# 201 SIMPANAN ANGGOTA, 202 SIMPANAN BERJANGKA (COA dasar). Gate membandingkan **total** subledger
# dengan total akun-akun ini: pemetaan per jenis produk belum ada, dan pemetaan per rekening tidak
# mungkin karena jurnal pemindahbukuan sengaja net-nol di akun yang sama.
- key: daycloser.postcheck.subledger_gl_accounts
  type: json
  scopes: [GLOBAL, INSTITUTION]
  schema: { type: array }
  sensitivity: NORMAL
  provenance:
    class: kebijakan
    compliance: NEEDS-COMPLIANCE-REVIEW
    note: "Akun GL kewajiban untuk total subledger simpanan; pemetaan per jenis produk = open item."
  default_pack: { base: ["201", "202"] }
