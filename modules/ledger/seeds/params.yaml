# Definisi parameter modul `ledger` (spec §10.3).
#
# Nilai di `default_pack` adalah nilai awal pack, BUKAN fallback kode: aplikasi tetap
# gagal-cepat bila nilai aktif tidak ada (spec §10.6).

# Format kode akun COA. Kode akun adalah identitas akuntansi institusi (spec §10.5: "format kode"),
# jadi polanya parameter — bukan konstanta di kode. Regex dicocokkan **seluruh string**.
# Default: angka dengan segmen bertitik, 1–3 digit per segmen (mis. `1`, `101`, `1.100.01`).
- key: ledger.coa.code_pattern
  type: string
  scopes: [GLOBAL, INSTITUTION]
  schema: { minLength: 5, maxLength: 120 }
  sensitivity: NORMAL
  default_pack: { base: "^[0-9]{1,3}(\\.[0-9]{1,3})*$" }

# --- Konsumen posting (T-074) -------------------------------------------------------------
# Batas operasional worker, bukan nilai bisnis akuntansi. Tetap parameter karena institusi boleh
# menyesuaikan beban kerjanya tanpa deploy.
- key: ledger.posting.batch_size
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 500 }
  sensitivity: NORMAL
  default_pack: { base: 50 }

- key: ledger.posting.max_attempts
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 100 }
  sensitivity: NORMAL
  default_pack: { base: 10 }

- key: ledger.posting.retry_backoff_seconds
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 1, maximum: 86400 }
  sensitivity: NORMAL
  default_pack: { base: 30 }

- key: ledger.posting.poll_interval_ms
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 50, maximum: 60000 }
  sensitivity: NORMAL
  default_pack: { base: 500 }

# Lease klaim outbox: event IN_FLIGHT yang lebih lama dari ini dianggap terdampar (worker mati) dan
# boleh diklaim ulang. Nilai > 0; jangan lebih kecil dari waktu proses satu event.
- key: ledger.posting.lease_seconds
  type: integer
  scopes: [GLOBAL, INSTITUTION]
  schema: { minimum: 30, maximum: 3600 }
  sensitivity: NORMAL
  default_pack: { base: 300 }
