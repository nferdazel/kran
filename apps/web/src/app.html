<!doctype html>
<html lang="id-ID" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KRAN</title>
    <!--
      Tema ditetapkan sebelum render (spec §15.3) untuk mencegah flash — skripnya berkas aset
      `static/theme.js`, **bukan** inline: Kit hanya menghash script buatannya sendiri, sehingga
      script inline di sini akan diblokir CSP `script-src 'self' 'sha256-…'` (O-061/D-045).
      Nilai disimpan di localStorage kunci `kran-theme`: "light" | "dark" | "system".
    -->
    <script src="%sveltekit.assets%/theme.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
