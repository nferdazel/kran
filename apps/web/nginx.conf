# kran-web di dalam container. Caddy di host me-reverse-proxy ke port ini, jadi tidak ada yang
# publik di sini dan TLS tidak diterminasi di sini. CSP tetap dari Caddy (vite.config.ts menulis
# kebijakan yang sama sebagai <meta>); berkas ini hanya transport + cache.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Penanda revisi yang dilayani image ini (diisi ARG GIT_REV saat build). Tidak di-cache: yang
    # bertanya justru sedang memeriksa versi yang sedang hidup.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /healthz =404;
    }

    # Hanya aset ber-hash (`_app/immutable`): nama yang sama tidak pernah berubah isinya.
    # `/_app/version.json` sengaja TIDAK masuk sini — klien SvelteKit mem-polling berkas itu untuk
    # mendeteksi versi baru, dan cache setahun akan mematikan deteksinya.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: `fallback: "index.html"` menghasilkan satu index.html, jadi rute dalam apa pun jatuh ke
    # sana dan router di klien yang menyelesaikannya.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
